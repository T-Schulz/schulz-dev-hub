# This is a basic Actions workflow to get IoT Data from Open Data Dortmund

name: Dortmund IoT Sync
on:
  schedule:
    - cron: '*/15 * * * *' # Läuft vollautomatisch alle 15 Minuten
  workflow_dispatch: # Erlaubt manuelles Starten per Klick

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      # KORREKTUR: Lädt jetzt die echten IoT-Klimasensoren statt der dortmund.de-Hauptseite
      - name: Daten von Stadt Dortmund laden
        run: |
          curl -s "https://open-data.dortmund.de/api/explore/v2.1/catalog/datasets/klimasensoren-aktuelle-messungen/records?limit=15" > dortmund-iot.json

      - name: Aenderungen committen und pushen
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add dortmund-iot.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Update Dortmund IoT Live Data" && git push)