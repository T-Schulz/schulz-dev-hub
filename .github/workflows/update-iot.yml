# This is a basic Actions workflow to get IoT Data from Open Data Dortmund

name: Dortmund IoT Sync
on:
  schedule:
    - cron: '*/15 * * * *' # Läuft alle 15 Minuten vollautomatisch
  workflow_dispatch: # Erlaubt manuelles Starten per Klick

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v5

      # KORREKTUR: Sucht deine HTML-Dateien und speichert die JSON exakt im selben Ordner ab
      - name: Daten von Stadt Dortmund laden und im HTML-Ordner ablegen
        run: |
          # Findet den Ordner, in dem deine Umwelt-Webseite liegt
          TARGET_DIR=$(dirname $(find . -name "index.html" | head -n 1))
          echo "HTML-Verzeichnis gefunden: $TARGET_DIR"
          
          # Speichert die JSON-Datei direkt in diesem Ordner ab
          curl -s "https://dortmund.de" > "$TARGET_DIR/dortmund-iot.json"

      - name: Aenderungen committen und pushen
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --quiet && git diff --cached --quiet || (git commit -m "Update Dortmund IoT Live Data in HTML folder" && git push)

      - name: Pages-Infrastruktur konfigurieren
        uses: actions/configure-pages@v5

      - name: Ordner-Inhalt als Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Verpackt das gesamte Repository inklusive aller Unterordner

      - name: Webseite live veroeffentlichen
        uses: actions/deploy-pages@v5