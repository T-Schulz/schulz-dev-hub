# This is a basic workflow to help you get started with Actions

name: Dortmund IoT Sync
on:
  schedule:
    - cron: '*/15 * * * *' # Läuft vollautomatisch alle 15 Minuten
  workflow_dispatch: # Erlaubt manuelles Starten per Klick

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Daten von Stadt Dortmund laden
        run: |
          curl -s "https://dortmund.de" > dortmund-iot.json

      - name: Aenderungen committen und pushen
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add dortmund-iot.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Update Dortmund IoT Live Data" && git push)
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
