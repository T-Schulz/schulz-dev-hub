<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - TU Dortmund H-Bahn (Debug Mode)</title>
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card-bg: #ffffff; --accent: #007bff; --border: #e0e0e0; }
        [data-theme="dark"] { --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --accent: #00adb5; --border: #333333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-link { display: inline-block; background-color: #333; color: white !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; border: none; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        #map { height: 420px; width: 100%; margin-top: 15px; border-radius: 8px; border: 1px solid var(--border); z-index: 1; }
        
        /* Waggon Styling */
        .hbahn-icon { background-color: #f39c12; border: 2px solid #ffffff; border-radius: 4px; box-shadow: 0 0 8px rgba(0,0,0,0.5); text-align: center; line-height: 18px; font-size: 12px; font-weight: bold; color: white; transition: all 0.1s linear; cursor: pointer; }
        
        /* Box-Styling für Logs und Koordinaten */
        .logger-title { margin-top: 15px; font-size: 0.95rem; font-weight: bold; }
        .coord-logger { width: 100%; height: 80px; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg); color: var(--text); box-sizing: border-box; resize: vertical; margin-top: 5px; }
        
        /* NEU: Live-Konsole auf der Webseite */
        .debug-console { width: 100%; height: 120px; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 6px; border: 2px solid #e74c3c; background-color: #fadbd8; color: #78281f; box-sizing: border-box; overflow-y: scroll; margin-top: 5px; }
        [data-theme="dark"] .debug-console { background-color: #78281f; color: #fadbd8; }
    </style>

    <!-- NEU: DIESER SCRIPT-BLOCK FÄNGT ALLE FEHLER AB, BEVOR ANDERE SKRIPTE GELADEN WERDEN -->
    <script>
        window.addEventListener('error', function(e) {
            const consoleBox = document.getElementById('debugConsole');
            if (consoleBox) {
                consoleBox.innerHTML += `❌ FEHLER: ${e.message} in ${e.filename.split('/').pop()} Zeile ${e.lineno}<br>`;
            }
            const status = document.getElementById("mapStatus");
            if (status) {
                status.innerHTML = "System-Absturz! Details siehe unten ❌";
                status.style.color = "#e74c3c";
            }
        });
        console.log = (function(oldLog) {
            return function(msg) {
                oldLog(msg);
                const consoleBox = document.getElementById('debugConsole');
                if (consoleBox) consoleBox.innerHTML += `ℹ️ INFO: ${msg}<br>`;
            }
        })(console.log);
    </script>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        <header>
            <h2>🚟 ÖPNV-Leitstelle TU Dortmund (H-Bahn)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Initialisiere Leitstelle...</div>
        </header>
        <div class="card">
            <div id="map"></div>
            
            <!-- Die universelle Sammelbox -->
            <div class="logger-title">📋 GPS-Sammelbox (Rechtsklick kopiert):</div>
            <textarea class="coord-logger" id="meinKartenLogger" readonly placeholder="Rechtsklick fügt Daten ein..."></textarea>

            <!-- NEU: Das Diagnose-Fenster zur Live-Fehleranalyse -->
            <div class="logger-title" style="color: #e74c3c;">🖥️ Live-Fehlermonitor (Echtzeit-Diagnose):</div>
            <div class="debug-console" id="debugConsole">System startet Diagnose...<br></div>
        </div>
    </div>

    <!-- Skripte nacheinander laden -->
    <script src="leaflet.js"></script>
    <script src="hbahn-data.js"></script>
    <script src="hbahn-engine.js"></script>
    
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        document.addEventListener("DOMContentLoaded", function() {
            console.log("DOM geladen. Starte Leaflet-Setup.");
            
            // Überprüfung ob Leaflet überhaupt existiert
            if (typeof L === 'undefined') {
                throw new Error("Leaflet ('L') ist nicht definiert! Datei 'leaflet.js' fehlt oder ist fehlerhaft.");
            }
            if (typeof hbahnData === 'undefined') {
                throw new Error("Datanbank-Objekt 'hbahnData' fehlt! Datei 'hbahn-data.js' prüfen.");
            }

            const map = L.map('map').setView([51.4840, 7.4110], 16);
            console.log("Kartenobjekt erstellt.");

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
            L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);
            console.log("Kacheln und Skala geladen.");

            L.polyline(hbahnData.strecke1, { color: '#78909c', weight: 6, opacity: 0.5 }).addTo(map);
            console.log("Strecke 1 gezeichnet.");

            hbahnData.haltestellen.forEach(function(stat, i) {
                L.circleMarker(stat.coords, { radius: 9, fillColor: "#00adb5", color: "#ffffff", weight: 2.5, opacity: 1, fillOpacity: 1 })
                 .addTo(map).bindPopup(`<h3>${stat.name}</h3>${stat.info}`);
            });
            console.log("Haltestellen platziert.");

            // Funktionen starten
            console.log("Starte Waggon-Animationen.");
            initWaggonAnimation(map, hbahnData.strecke1);        
            initExpressDummyAnimation(map, hbahnData.strecke1);  
            activateGlobalRightClickLogger(map, "meinKartenLogger");
            
            console.log("System erfolgreich initialisiert!");
            document.getElementById("mapStatus").innerHTML = "Status: Leitstelle online ✔";
        });
    </script>
</body>
</html>
