<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - TU Dortmund H-Bahn</title>
    
    <!-- LOKALES CSS: Nutzt deine lokal gespeicherte CSS-Datei -->
    <link rel="stylesheet" href="leaflet.css" />
    
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        #map {
            height: 520px; /* Etwas höher für die Nord-Süd-Ausdehnung des Campus */
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1;
        }

        .coordinate-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            font-family: monospace;
            font-size: 11px;
            color: #333;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        [data-theme="dark"] .coordinate-box {
            background: rgba(30, 30, 30, 0.8);
            color: #e0e0e0;
            border-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🚟 ÖPNV-Leitstelle TU Dortmund (H-Bahn)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Campus-Netz aktiv ✔</div>
        </header>

        <div class="card">
            <div id="map"></div>
        </div>
    </div>

    <!-- LOKALES SCRIPT: Nutzt deine lokal gespeicherte JS-Datei -->
    <script src="leaflet.js"></script>
    
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Karte zentrieren (Zentrum liegt genau zwischen Campus Nord und Campus Süd)
            const map = L.map('map').setView([51.4895, 7.4095], 15);

            // 2. OpenStreetMap Kacheln laden
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a>'
            }).addTo(map);

            // 3. Maßstab hinzufügen
            L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

            // 4. Koordinaten-Box für Mausbewegung
            const CoordControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function() {
                    const container = L.DomUtil.create('div', 'coordinate-box');
                    container.innerHTML = "Lat: 51.4895, Lon: 7.4095";
                    map.on('mousemove', function(e) {
                        container.innerHTML = `Lat: ${e.latlng.lat.toFixed(4)}, Lon: ${e.latlng.lng.toFixed(4)}`;
                    });
                    return container;
                }
            });
            map.addControl(new CoordControl());

            // 5. STRECKENVERLAUF ALS LINIE (Polyline) EINZEICHNEN
            // Linie 1: Technologiezentrum - Campus Nord - S-Bahn
            const linie1Coords = [
                [51.4938, 7.4038], // Technologiezentrum
                [51.4925, 7.4124], // Campus Nord
                [51.4912, 7.4150]  /* Universität S-Bahn */
            ];
            L.polyline(linie1Coords, { color: '#ef5350', weight: 4, dashArray: '5, 5' }).addTo(map);

            // Linie 2: Campus Nord - Campus Süd - Eichlinghofen
            const linie2Coords = [
                [51.4925, 7.4124], // Campus Nord
                [51.4883, 7.4116], // Campus Süd
                [51.4842, 7.4052]  /* Eichlinghofen */
            ];
            L.polyline(linie2Coords, { color: '#42a5f5', weight: 4, dashArray: '5, 5' }).addTo(map);


            // 6. DIE 5 HALTESTELLEN ALS REALE SVG-MARKER
            const stationen = [
                { name: "🚟 H-Bahn Technologiezentrum", coords: [51.4938, 7.4038], info: "Linie 1<br>Takt: 10 Min.<br>Status: <b>Normalbetrieb</b>" },
                { name: "🚟 H-Bahn Campus Nord", coords: [51.4925, 7.4124], info: "Zentraler Umstieg Knotenpunkt (Linie 1 & 2)<br>Status: <b>Normalbetrieb</b>" },
                { name: "🚟 H-Bahn DO-Universität (S)", coords: [51.4912, 7.4150], info: "Anschluss an S-Bahn S1 Richtung Dortmund Hbf / Düsseldorf<br>Status: <b>Hohes Fahrgastaufkommen</b>" },
                { name: "🚟 H-Bahn Campus Süd", coords: [51.4883, 7.4116], info: "Linie 2<br>Takt: 5 Min. (Pendelverkehr)<br>Status: <b>Normalbetrieb</b>" },
                { name: "🚟 H-Bahn Eichlinghofen", coords: [51.4842, 7.4052], info: "Endstation Linie 2<br>Anschluss zu lokalen Buslinien<br>Status: <b>Normalbetrieb</b>" }
            ];

            stationen.forEach(function(stat) {
                L.circleMarker(stat.coords, {
                    radius: 7,
                    fillColor: "#00adb5",
                    color: "#ffffff",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 1
                })
                .addTo(map)
                .bindPopup(`<h3>${stat.name}</h3>${stat.info}<br><small>GPS: ${stat.coords[0]}, ${stat.coords[1]}</small>`);
            });
        });
    </script>
</body>
</html>
