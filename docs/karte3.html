<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU Dortmund (Karte 3)</title>
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card-bg: #ffffff; --accent: #007bff; --border: #e0e0e0; }
        [data-theme="dark"] { --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --accent: #00adb5; --border: #333333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-link { display: inline-block; background-color: #333; color: white !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; border: none; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        #map { height: 480px; width: 100%; margin-top: 15px; border-radius: 8px; border: 1px solid var(--border); z-index: 1; }
        
        .logger-title { margin-top: 20px; font-size: 0.95rem; font-weight: bold; }
        .coord-logger { width: 100%; height: 90px; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg); color: var(--text); box-sizing: border-box; resize: vertical; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptseite</a>
        <header>
            <h2>🚟 TU Dortmund (H-Bahn)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Online ✔</div>
        </header>
        <div class="card">
            <div id="map"></div>
            <div class="logger-title">📋 GPS-Sammelbox (Rechtsklick auf Karte kopiert GPS-Koordinaten):</div>
            <textarea class="coord-logger" id="meinKartenLogger" readonly placeholder="Rechtsklick fügt Daten ein..."></textarea>
        </div>
    </div>

    <!-- Skripte laden -->
    <script src="leaflet.js"></script>
    <script src="hbahn-data.js"></script>
    
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        // ====================================================================
        // KORRIGIERTE INTERNE GEOMETRIE-ENGINE
        // ====================================================================
        function getInterpolatedPoint(p1, p2, fraction) {
            const lat = p1[0] + (p2[0] - p1[0]) * fraction;
            const lng = p1[1] + (p2[1] - p1[1]) * fraction;
            return [lat, lng];
        }

        function calculateCurrentPosition(coords, totalFraction) {
            if (!coords || coords.length === 0) return [51.4835, 7.4110];
            if (totalFraction <= 0) return coords[0];
            if (totalFraction >= 1) return coords[coords.length - 1];
            const numSegments = coords.length - 1;
            const segmentFraction = 1 / numSegments;
            const targetSegment = Math.floor(totalFraction / segmentFraction);
            const remainder = (totalFraction % segmentFraction) / segmentFraction;
            return getInterpolatedPoint(coords[targetSegment], coords[targetSegment + 1], remainder);
        }

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Karte laden und fokussieren
            const map = L.map('map').setView([51.4835, 7.4110], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
            L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

            // ====================================================================
            // LIVE-KOORDINATEN ANZEIGE BEI MAUSBEWEGUNG
            // ====================================================================
            const CoordControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function() {
                    const container = L.DomUtil.create('div', 'coordinate-box');
                    container.style.background = 'rgba(255,255,255,0.8)';
                    container.style.padding = '5px';
                    container.style.borderRadius = '4px';
                    container.innerHTML = "Lat: 51.48350, Lon: 7.41100";
                    map.on('mousemove', function(e) {
                        container.innerHTML = `Lat: ${e.latlng.lat.toFixed(5)}, Lon: ${e.latlng.lng.toFixed(5)}`;
                    });
                    return container;
                }
            });
            map.addControl(new CoordControl());

            // 2. Schienennetz aus hbahn-data.js zeichnen
            L.polyline(hbahnData.strecke1, { color: '#78909c', weight: 6, opacity: 0.5 }).addTo(map);
            L.polyline(hbahnData.strecke2, { color: '#4caf50', weight: 6, opacity: 0.5 }).addTo(map); // Strecke 2 in grün

            // 3. Haltestellen zeichnen (Große Kreise)
            hbahnData.haltestellen.forEach(function(stat) {
                L.circleMarker(stat.coords, { radius: 9, fillColor: "#00adb5", color: "#ffffff", weight: 2.5, opacity: 1, fillOpacity: 1 })
                 .addTo(map).bindPopup(`<h3>${stat.name}</h3>${stat.info}`);
            });

            // ====================================================================
            // WAGGON-INITIALISIERUNG (Fehler aus Teil 1 hier komplett entfernt!)
            // ====================================================================
            const fahrplanWaggon = L.circleMarker(hbahnData.strecke1[0], {
                radius: 12, fillColor: "#f39c12", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.85
            }).addTo(map);
            fahrplanWaggon.bindPopup("<b>🚟 Fahrplan-Waggon (Linie 50)</b>");

            const expressWaggon = L.circleMarker(hbahnData.strecke1[0], {
                radius: 7, fillColor: "#e74c3c", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 1
            }).addTo(map);
            expressWaggon.bindPopup("<b>🚀 Express-Test-Waggon</b>");

            // NEU: Ein dritter Waggon, der exklusiv auf der neuen Strecke 2 pendelt!
            const strecke2Waggon = L.circleMarker(hbahnData.strecke2[0] || [51.4835, 7.4110], {
                radius: 10, fillColor: "#9b59b6", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9
            }).addTo(map);
            strecke2Waggon.bindPopup("<b>🚟 Campus-Pendel (Strecke 2)</b>");

            // 4. ANIMATIONS-TIMER STARTEN
            let expressDirection = true;
            let expressProgress = 0;
            
            let strecke2Direction = true;
            let strecke2Progress = 0;

            setInterval(() => {
                // --- A. Berechnung für den Fahrplan-Waggon (Strecke 1) ---
                const jetzt = new Date();
                const sekunden = (jetzt.getMinutes() * 60) + jetzt.getSeconds();
                const fortschritt = sekunden % 600; // 10-Minuten-Umlauf
                let fahrplanPos, fahrplanText = "", statusInfo = "";

                if (fortschritt >= 0 && fortschritt < 120) {
                    fahrplanPos = calculateCurrentPosition(hbahnData.strecke1, fortschritt / 120);
                    fahrplanText = "Unterwegs nach: <b>Campus Süd</b>";
                    statusInfo = "Fahrt nach Campus Süd 🟢";
                } else if (fortschritt >= 120 && fortschritt < 180) {
                    fahrplanPos = hbahnData.strecke1[hbahnData.strecke1.length - 1];
                    fahrplanText = "Halt in <b>Campus Süd</b><br>Fahrgastwechsel.";
                    statusInfo = "Halt am Campus 🟡";
                } else if (fortschritt >= 180 && fortschritt < 300) {
                    const rueckfahrtRoute = [...hbahnData.strecke1].reverse();
                    fahrplanPos = calculateCurrentPosition(rueckfahrtRoute, (fortschritt - 180) / 120);
                    fahrplanText = "Unterwegs nach: <b>Eichlinghofen</b>";
                    statusInfo = "Fahrt nach Eichlinghofen 🟢";
                } else {
                    fahrplanPos = hbahnData.strecke1[0];
                    const restWartezeit = Math.ceil(600 - fortschritt);
                    fahrplanText = `Wartet in <b>Eichlinghofen</b>.<br>Nächste Abfahrt in: ${Math.floor(restWartezeit / 60)}m ${restWartezeit % 60}s`;
                    statusInfo = `Pause in Eichlinghofen (Abfahrt in ${Math.floor(restWartezeit / 60)}m) 🔵`;
                }
                
                fahrplanWaggon.setLatLng(fahrplanPos);
                fahrplanWaggon.getPopup().setContent(`<h3>🚟 Fahrplan-Waggon</h3>${fahrplanText}`);
                document.getElementById("mapStatus").innerHTML = `Fahrplan-Status: ${statusInfo}`;

                // --- B. Berechnung für den schnellen Express-Waggon (Strecke 1) ---
                if (expressDirection) {
                    expressProgress += 0.005;
                    if (expressProgress >= 1) expressDirection = false;
                } else {
                    expressProgress -= 0.005;
                    if (expressProgress <= 0) expressDirection = true;
                }
                const expressPos = calculateCurrentPosition(hbahnData.strecke1, expressProgress);
                expressWaggon.setLatLng(expressPos);
                expressWaggon.getPopup().setContent(`<h3>🚀 Express-Waggon</h3>Ziel: <b>${expressDirection ? "Campus Süd" : "Eichlinghofen"}</b>`);

                // --- C. NEU: Berechnung für den Waggon auf Strecke 2 ---
                if (hbahnData.strecke2 && hbahnData.strecke2.length > 0) {
                    if (strecke2Direction) {
                        strecke2Progress += 0.003; // Etwas langsamer als Express
                        if (strecke2Progress >= 1) strecke2Direction = false;
                    } else {
                        strecke2Progress -= 0.003;
                        if (strecke2Progress <= 0) strecke2Direction = true;
                    }
                    const s2Pos = calculateCurrentPosition(hbahnData.strecke2, strecke2Progress);
                    strecke2Waggon.setLatLng(s2Pos);
                    strecke2Waggon.getPopup().setContent(`<h3>🚟 Strecke 2 Waggon</h3>Status: Pendelt auf neuer Route 🔄`);
                }

            }, 50);

            // 5. RECHTSKLICK-LOGGER AKTIVIEREN
            const loggerBox = document.getElementById("meinKartenLogger");
            map.on('contextmenu', function(e) {
                const chunk = `[${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}], // Klick-Punkt\n`;
                loggerBox.value += chunk;
                navigator.clipboard.writeText(`[${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}]`);
            });
        });
    </script>
