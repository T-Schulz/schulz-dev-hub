<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - TU Dortmund H-Bahn</title>
    
    <!-- LOKALES CSS -->
    <link rel="stylesheet" href="leaflet.css" />
    
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        #map {
            height: 520px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1;
        }

        .coordinate-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            font-family: monospace;
            font-size: 11px;
            color: #333;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        [data-theme="dark"] .coordinate-box {
            background: rgba(30, 30, 30, 0.8);
            color: #e0e0e0;
            border-color: #555;
        }

        /* NEU: Styling für die Koordinaten-Sammelbox unter der Karte */
        .logger-title {
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: bold;
        }
        .coord-logger {
            width: 100%;
            height: 120px;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--text);
            box-sizing: border-box;
            resize: vertical;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🚟 ÖPNV-Leitstelle TU Dortmund (H-Bahn)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Rechtsklick zum Kopieren aktiv 📋</div>
        </header>

        <div class="card">
            <!-- Die Karte -->
            <div id="map"></div>

            <!-- NEU: Die interaktive Sammelbox für deine präzisen GPS-Daten -->
            <div class="logger-title">📋 Präzise GPS-Sammelbox (Rechtsklick auf Karte zum Hinzufügen):</div>
            <textarea class="coord-logger" id="coordLogger" readonly placeholder="Mache einen Rechtsklick auf die Karte, um exakte Koordinaten hier zu sammeln..."></textarea>
        </div>
    </div>

    <!-- LOKALES SCRIPT -->
    <script src="leaflet.js"></script>
    
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Karte zentrieren (Über dem Campus der TU Dortmund)
            const map = L.map('map').setView([51.4895, 7.4120], 15);

            // 2. OpenStreetMap Kacheln laden
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a>'
            }).addTo(map);

            // 3. Maßstab hinzufügen
            L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

            // 4. Koordinaten-Box für Mausbewegung
            const CoordControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function() {
                    const container = L.DomUtil.create('div', 'coordinate-box');
                    container.innerHTML = "Lat: 51.4895, Lon: 7.4120";
                    map.on('mousemove', function(e) {
                        container.innerHTML = `Lat: ${e.latlng.lat.toFixed(5)}, Lon: ${e.latlng.lng.toFixed(5)}`;
                    });
                    return container;
                }
            });
            map.addControl(new CoordControl());


            // ====================================================================
            // NEU: INTERAKTIVES RECHTSKLICK-EVENT ZUM HOCHPRÄZISEN KOORDINATEN-LOGGEN
            // ====================================================================
            const loggerTextarea = document.getElementById('coordLogger');
            
            map.on('contextmenu', function(e) {
                // Holt die ungerundeten, maximal präzisen 6-stelligen GPS-Werte
                const lat = e.latlng.lat.toFixed(6);
                const lng = e.latlng.lng.toFixed(6);
                
                // Formatierung als fertiges JavaScript-Array-Objekt für deinen Code
                const formattedString = `[${lat}, ${lng}], // Klick-Punkt\n`;
                
                // In das Textfeld unten eintragen
                loggerTextarea.value += formattedString;
                
                // Automatisch in die echte Windows/Mac-Zwischenablage kopieren
                navigator.clipboard.writeText(`[${lat}, ${lng}]`).then(() => {
                    // Temporärer visueller Indikator im Statusfeld
                    const alterStatus = document.getElementById("mapStatus").innerHTML;
                    document.getElementById("mapStatus").innerHTML = `Kopiert: [${lat}, ${lng}] ✔`;
                    document.getElementById("mapStatus").style.color = "#007bff";
                    setTimeout(() => {
                        document.getElementById("mapStatus").innerHTML = alterStatus;
                        document.getElementById("mapStatus").style.color = "#27ae60";
                    }, 1500);
                }).catch(err => {
                    console.error('Fehler beim Kopieren in die Zwischenablage: ', err);
                });
            });
            // ====================================================================


            // 5. STRECKENVERLAUF ALS LINIE (Bisherige grobe Annäherung)
            const linie1Coords = [
                [51.4938, 7.4038], 
                [51.4925, 7.4124], 
                [51.4912, 7.4150]
            ];
            L.polyline(linie1Coords, { color: '#ef5350', weight: 4, dashArray: '5, 5' }).addTo(map);

            const linie2Coords = [
                [51.4925, 7.4124], 
                [51.4883, 7.4116], 
                [51.4842, 7.4052]
            ];
            L.polyline(linie2Coords, { color: '#42a5f5', weight: 4, dashArray: '5, 5' }).addTo(map);


            // 6. DIE 5 HALTESTELLEN ALS REALE SVG-MARKER (Bisherige grobe Annäherung)
            const stationen = [
                { name: "🚟 H-Bahn Technologiezentrum", coords: [51.4938, 7.4038], info: "Linie 1" },
                { name: "🚟 H-Bahn Campus Nord", coords: [51.4925, 7.4124], info: "Zentraler Knotenpunkt" },
                { name: "🚟 H-Bahn DO-Universität (S)", coords: [51.4912, 7.4150], info: "Anschluss an S1" },
                { name: "🚟 H-Bahn Campus Süd", coords: [51.4883, 7.4116], info: "Linie 2" },
                { name: "🚟 H-Bahn Eichlinghofen", coords: [51.4842, 7.4052], info: "Endstation Linie 2" }
            ];

            stationen.forEach(function(stat) {
                L.circleMarker(stat.coords, {
                    radius: 7,
                    fillColor: "#00adb5",
                    color: "#ffffff",
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 1
                })
                .addTo(map)
                .bindPopup(`<h3>${stat.name}</h3>${stat.info}<br><small>GPS: ${stat.coords[0]}, ${stat.coords[1]}</small>`);
            });
        });
    </script>
</body>
</html>
