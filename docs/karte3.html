<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund (DSGVO Leaflet)</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        #map-container {
            height: 480px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            position: relative;
            background-color: #e5e3df;
        }

        osm-map {
            width: 100%;
            height: 100%;
            display: none;
        }

        .privacy-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            z-index: 20;
        }
        [data-theme="dark"] .privacy-overlay {
            background-color: #252525;
        }
        .privacy-overlay p {
            max-width: 450px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .btn-activate {
            background-color: var(--accent);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund (Leaflet DSGVO)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #e67e22; font-size: 0.9rem;">Status: Blockiert (Wartet auf Erlaubnis) 🔒</div>
        </header>

        <div class="card">
            <div id="map-container">
                
                <!-- Datenschutz-Box -->
                <div class="privacy-overlay" id="privacyNotice">
                    <h3>🔒 Datenschutz-Hinweis</h3>
                    <p>Beim Aktivieren der Karte werden Daten vom Drittanbieter-Server (OpenStreetMap & unpkg.com) nachgeladen. Dabei wird Ihre IP-Adresse übertragen.</p>
                    <button class="btn-activate" onclick="erlaubeUndLadeKarte()">Karte laden und Daten akzeptieren</button>
                </div>

                <!-- Custom-Element mit GPS-Koordinaten für Dortmund -->
                <osm-map id="meineKarte" topleft="51.5210, 7.4520" bottomright="51.5070, 7.4780">
                    <osm-marker latlon="51.5146, 7.4675" title="🌱 Umweltstation Innenstadt" popup="Typ: senseBox Climate<br>Status: ACTIVE"></osm-marker>
                    <osm-marker latlon="51.5176, 7.4590" title="🚗 Parkplatz Hauptbahnhof" popup="Typ: LoRaWAN Park-Sensor<br>Status: BELEGT"></osm-marker>
                    <osm-marker latlon="51.5133, 7.4612" title="🔋 E-Ladesäule Stadtgarten" popup="Typ: IoT-Wallbox<br>Status: FREI"></osm-marker>
                </osm-map>

            </div>
        </div>
    </div>

    <!-- HIER werden die externe Logik-Datei und die Theme-Erkennung geladen -->
    <script src="map-loader.js"></script>
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }
    </script>
</body>
</html>
