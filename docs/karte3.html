<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - TU Dortmund H-Bahn</title>
    
    <!-- LOKALES CSS -->
    <link rel="stylesheet" href="leaflet.css" />
    
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        #map {
            height: 520px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1;
        }

        .coordinate-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            font-family: monospace;
            font-size: 11px;
            color: #333;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        [data-theme="dark"] .coordinate-box {
            background: rgba(30, 30, 30, 0.8);
            color: #e0e0e0;
            border-color: #555;
        }

        .logger-title {
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: bold;
        }
        .coord-logger {
            width: 100%;
            height: 120px;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--text);
            box-sizing: border-box;
            resize: vertical;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🚟 ÖPNV-Leitstelle TU Dortmund (H-Bahn)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Präzise Linienführung aktiv ✔</div>
        </header>

        <div class="card">
            <!-- Die Karte -->
            <div id="map"></div>

            <!-- Die interaktive Sammelbox für weitere Strecken -->
            <div class="logger-title">📋 Weitere GPS-Punkte sammeln (Rechtsklick auf Karte zum Hinzufügen):</div>
            <textarea class="coord-logger" id="coordLogger" readonly placeholder="Mache einen Rechtsklick auf die Karte, um exakte Koordinaten hier zu sammeln..."></textarea>
        </div>
    </div>

    <!-- LOKALES SCRIPT -->
    <script src="leaflet.js"></script>
    
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Karte zentrieren (Fokus leicht nach Süden verschoben auf Strecke 1)
            const map = L.map('map').setView([51.4880, 7.4110], 15);

            // 2. OpenStreetMap Kacheln laden
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a>'
            }).addTo(map);

            // 3. Maßstab hinzufügen
            L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

            // 4. Koordinaten-Box für Mausbewegung
            const CoordControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function() {
                    const container = L.DomUtil.create('div', 'coordinate-box');
                    container.innerHTML = "Lat: 51.4880, Lon: 7.4110";
                    map.on('mousemove', function(e) {
                        container.innerHTML = `Lat: ${e.latlng.lat.toFixed(5)}, Lon: ${e.latlng.lng.toFixed(5)}`;
                    });
                    return container;
                }
            });
            map.addControl(new CoordControl());

            // 5. INTERAKTIVES RECHTSKLICK-EVENT FÜR WEITERE STRECKEN
            const loggerTextarea = document.getElementById('coordLogger');
            map.on('contextmenu', function(e) {
                const lat = e.latlng.lat.toFixed(6);
                const lng = e.latlng.lng.toFixed(6);
                const formattedString = `[${lat}, ${lng}], // Klick-Punkt\n`;
                loggerTextarea.value += formattedString;
                
                navigator.clipboard.writeText(`[${lat}, ${lng}]`).then(() => {
                    const alterStatus = document.getElementById("mapStatus").innerHTML;
                    document.getElementById("mapStatus").innerHTML = `Kopiert: [${lat}, ${lng}] ✔`;
                    document.getElementById("mapStatus").style.color = "#007bff";
                    setTimeout(() => {
                        document.getElementById("mapStatus").innerHTML = alterStatus;
                        document.getElementById("mapStatus").style.color = "#27ae60";
                    }, 1500);
                });
            });

            // ====================================================================
            // DEINE REALEN KOORDINATEN-DATEN
            // ====================================================================

            // 6. STRECKE 1: Eichlinghofen bis Campus Süd (Verbindungslinie)
            const strecke1Coords = [
                [51.481511, 7.409145], // Eichlinghofen Haltestelle
                [51.481865, 7.409188], // Streckenpunkt11
                [51.482420, 7.409242], // Streckenpunkt12
                [51.482921, 7.409099], // Streckenpunkt13
                [51.483589, 7.409303], // Streckenpunkt14
                [51.484035, 7.409960], // Streckenpunkt15
                [51.484563, 7.411489], // Streckenpunkt16
                [51.484867, 7.412562], // Streckenpunkt17
                [51.484982, 7.413144]  // Campus Süd Haltestelle
            ];
            // Rote Linie für die aktive Strecke 1
            L.polyline(strecke1Coords, { color: '#ef5350', weight: 4, opacity: 0.8 }).addTo(map);

            // 7. RENDERING DER REINEN STRECKENPUNKTE (Kleinere graue Kreise)
            const streckenPunkte = [
                [51.481865, 7.409188], // SP 11
                [51.482420, 7.409242], // SP 12
                [51.482921, 7.409099], // SP 13
                [51.483589, 7.409303], // SP 14
                [51.484035, 7.409960], // SP 15
                [51.484563, 7.411489], // SP 16
                [51.484867, 7.412562]  // SP 17
            ];
            streckenPunkte.forEach(function(coord, index) {
                L.circleMarker(coord, {
                    radius: 4,
                    fillColor: "#78909c",
                    color: "#ffffff",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 1
                })
                .addTo(map)
                .bindPopup(`<b>Streckenpunkt 1.${index + 1}</b><br>GPS: ${coord[0]}, ${coord[1]}`);
            });

            // 8. RENDERING DER 5 REALEN HALTESTELLEN (Größere cyan-farbene Kreise)
            const haltestellen = [
                { name: "🚟 H-Bahn Technologiezentrum", coords: [51.493336, 7.406970], info: "Endstation Nord-Ast" },
                { name: "🚟 H-Bahn Campus Nord", coords: [51.492533, 7.415660], info: "Zentraler Hauptknotenpunkt" },
                { name: "🚟 H-Bahn Dortmund Universität (S)", coords: [51.492321, 7.417398], info: "Anschluss S-Bahn S1" },
                { name: "🚟 H-Bahn Campus Süd", coords: [51.484982, 7.413144], info: "Knotenpunkt Süd-Ast" },
                { name: "🚟 H-Bahn Eichlinghofen", coords: [51.481511, 7.409145], info: "Endstation Süd-Ast" }
            ];

            haltestellen.forEach(function(stat) {
                L.circleMarker(stat.coords, {
                    radius: 9, // Größerer Radius für Haltestellen
                    fillColor: "#00adb5",
                    color: "#ffffff",
                    weight: 2.5,
                    opacity: 1,
                    fillOpacity: 1
                })
                .addTo(map)
                .bindPopup(`<h3>${stat.name}</h3>${stat.info}<br><small>GPS: ${stat.coords[0]}, ${stat.coords[1]}</small>`);
            });
        });
    </script>
</body>
</html>
