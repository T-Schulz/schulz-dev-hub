<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU Dortmund (Karte 3)</title>
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card-bg: #ffffff; --accent: #007bff; --border: #e0e0e0; }
        [data-theme="dark"] { --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --accent: #00adb5; --border: #333333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-link { display: inline-block; background-color: #333; color: white !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; border: none; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        #map { height: 480px; width: 100%; margin-top: 15px; border-radius: 8px; border: 1px solid var(--border); z-index: 1; }
        
        .logger-title { margin-top: 20px; font-size: 0.95rem; font-weight: bold; }
        .coord-logger { width: 100%; height: 90px; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg); color: var(--text); box-sizing: border-box; resize: vertical; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptseite</a>
        <header>
            <h2>🚟 TU Dortmund (H-Bahn)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Online ✔</div>
        </header>
        <div class="card">
            <div id="map"></div>
            <div class="logger-title">📋 GPS-Sammelbox (Rechtsklick auf Karte kopiert GPS-Koordinaten):</div>
            <textarea class="coord-logger" id="meinKartenLogger" readonly placeholder="Rechtsklick fügt Daten ein..."></textarea>

            <!-- NEU: Steuerungs-Buttons für den Logger -->
            <div style="margin-top: 10px; display: flex; gap: 10px;">
                <button id="btnCopyJson" class="btn-link" style="margin: 0; background-color: #27ae60; cursor: pointer;">📋 Gesamtes JSON kopieren</button>
                <button id="btnClearLogger" class="btn-link" style="margin: 0; background-color: #e74c3c; cursor: pointer;">🗑️ Box leeren</button>
                <button id="btnTogglePoints" class="btn-link" style="margin: 0; background-color: #2980b9; cursor: pointer;">👁️ Punkte anzeigen</button>
            </div>
        </div>
    </div>

    <!-- Skripte laden -->
    <script src="leaflet.js"></script>
    <script src="hbahn-data.js"></script>
    
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        // ====================================================================
        // PHYSIKALISCHE GEOMETRIE-ENGINE (DISTANZ IN METERN)
        // ====================================================================
        
        // Berechnet die Gesamtlänge einer Strecke in Metern
        function getRouteLengthInMeters(map, coords) {
            if (!coords || coords.length < 2) return 0;
            let totalDistance = 0;
            for (let i = 0; i < coords.length - 1; i++) {
                totalDistance += map.distance(coords[i], coords[i + 1]);
            }
            return totalDistance;
        }

        // Findet die genaue Koordinate basierend auf der Entfernung in Metern vom Start
        function getPositionAtDistance(map, coords, targetDistanceInMeters) {
            if (!coords || coords.length === 0) return [51.4835, 7.4110];
            if (targetDistanceInMeters <= 0) return coords[0];
            
            let accumulatedDistance = 0;

            for (let i = 0; i < coords.length - 1; i++) {
                const p1 = coords[i];
                const p2 = coords[i + 1];
                const segmentDistance = map.distance(p1, p2);

                // Liegt die gesuchte Distanz in diesem Segment?
                if (accumulatedDistance + segmentDistance >= targetDistanceInMeters) {
                    const remainingDistanceInSegment = targetDistanceInMeters - accumulatedDistance;
                    const fraction = segmentDistance > 0 ? (remainingDistanceInSegment / segmentDistance) : 0;
                    
                    // Lineare Interpolation der Koordinaten im aktuellen Segment
                    const lat = p1[0] + (p2[0] - p1[0]) * fraction;
                    const lng = p1[1] + (p2[1] - p1[1]) * fraction;
                    return [lat, lng];
                }
                accumulatedDistance += segmentDistance;
            }
            
            // Fallback: Wenn Distanz größer als Strecke, liefere Endpunkt
            return coords[coords.length - 1];
        }

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Karte laden (ohne festen View)
            const map = L.map('map');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
            L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

            // NEU: Karte automatisch so zoomen, dass Strecke 1 und Strecke 2 komplett sichtbar sind
            const alleStrecken = L.featureGroup([L.polyline(hbahnData.strecke1), L.polyline(hbahnData.strecke2)]);
            map.fitBounds(alleStrecken.getBounds().pad(0.1)); // pad(0.1) fügt 10% Rand hinzu

            // ====================================================================
            // LIVE-KOORDINATEN ANZEIGE BEI MAUSBEWEGUNG
            // ====================================================================
            const CoordControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function() {
                    const container = L.DomUtil.create('div', 'coordinate-box');
                    container.style.background = 'rgba(255,255,255,0.8)';
                    container.style.padding = '5px';
                    container.style.borderRadius = '4px';
                    container.innerHTML = "Lat: 51.48350, Lon: 7.41100";
                    map.on('mousemove', function(e) {
                        container.innerHTML = `Lat: ${e.latlng.lat.toFixed(5)}, Lon: ${e.latlng.lng.toFixed(5)}`;
                    });
                    return container;
                }
            }); // KORREKTUR: Hier wurde die Definition der Control-Klasse geschlossen
            map.addControl(new CoordControl()); // KORREKTUR: Hier wurde das Element der Karte hinzugefügt

            // ====================================================================
            // NEU: STRECKENPUNKTE VISUALISIEREN (ROT)
            // ====================================================================
            const btnTogglePoints = document.getElementById("btnTogglePoints");
            
            // Layer-Gruppe für die roten Punkte
            const punkteLayerGruppe = L.layerGroup();
            let punkteSichtbar = false;

            // Funktion, um die Punkte zu generieren
            function zeichneStreckenPunkte() {
                punkteLayerGruppe.clearLayers(); // Altes Zeichnen löschen

                // Punkte für Strecke 1 hinzufügen
                if (hbahnData.strecke1) {
                    hbahnData.strecke1.forEach((coord, index) => {
                        L.circleMarker(coord, {
                            radius: 5,
                            fillColor: "#e74c3c", // Deutlich rot
                            color: "#c0392b",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 1
                        })
                        .addTo(punkteLayerGruppe)
                        .bindPopup(`<b>Strecke 1</b><br>Punkt-Index: ${index}<br>Lat: ${coord[0]}, Lng: ${coord[1]}`);
                    });
                }

                // Punkte für Strecke 2 hinzufügen
                if (hbahnData.strecke2) {
                    hbahnData.strecke2.forEach((coord, index) => {
                        L.circleMarker(coord, {
                            radius: 5,
                            fillColor: "#e74c3c", // Deutlich rot
                            color: "#c0392b",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 1
                        })
                        .addTo(punkteLayerGruppe)
                        .bindPopup(`<b>Strecke 2</b><br>Punkt-Index: ${index}<br>Lat: ${coord[0]}, Lng: ${coord[1]}`);
                    });
                }
            }

            // Klick-Event für den Button
            btnTogglePoints.addEventListener("click", function() {
                punkteSichtbar = !punkteSichtbar;

                if (punkteSichtbar) {
                    zeichneStreckenPunkte();
                    map.addLayer(punkteLayerGruppe);
                    btnTogglePoints.innerHTML = "🙈 Punkte ausblenden";
                    btnTogglePoints.style.backgroundColor = "#7f8c8d";
                } else {
                    map.removeLayer(punkteLayerGruppe);
                    btnTogglePoints.innerHTML = "👁️ Punkte anzeigen";
                    btnTogglePoints.style.backgroundColor = "#2980b9";
                }
            });

            
            map.addControl(new CoordControl());

            // 2. Schienennetz aus hbahn-data.js zeichnen
            L.polyline(hbahnData.strecke1, { color: '#78909c', weight: 6, opacity: 0.5 }).addTo(map);
            L.polyline(hbahnData.strecke2, { color: '#4caf50', weight: 6, opacity: 0.5 }).addTo(map); // Strecke 2 in grün

            // 3. Haltestellen zeichnen (Große Kreise)
            hbahnData.haltestellen.forEach(function(stat) {
                L.circleMarker(stat.coords, { radius: 9, fillColor: "#00adb5", color: "#ffffff", weight: 2.5, opacity: 1, fillOpacity: 1 })
                 .addTo(map).bindPopup(`<h3>${stat.name}</h3>${stat.info}`);
            });

            // ====================================================================
            // WAGGON-INITIALISIERUNG
            // ====================================================================
            const fahrplanWaggon = L.circleMarker(hbahnData.strecke1[0], {
                radius: 12, fillColor: "#f39c12", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.85
            }).addTo(map);
            fahrplanWaggon.bindPopup("<b>🚟 Fahrplan-Waggon (Linie 50)</b>");

            const expressWaggon = L.circleMarker(hbahnData.strecke1[0], {
                radius: 7, fillColor: "#e74c3c", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 1
            }).addTo(map);
            expressWaggon.bindPopup("<b>🚀 Express-Test-Waggon</b>");

            // Initialisierung für Strecke 2 Waggon mit Fallback-Koordinate falls Strecke leer ist
            const s2Start = (hbahnData.strecke2 && hbahnData.strecke2.length > 0) ? hbahnData.strecke2[0] : [51.4835, 7.4110];
            const strecke2Waggon = L.circleMarker(s2Start, {
                radius: 10, fillColor: "#9b59b6", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9
            }).addTo(map);
            strecke2Waggon.bindPopup("<b>🚟 Campus-Pendel (Strecke 2)</b>");

            // 4. ANIMATIONS-TIMER STARTEN
            let expressDirection = true;
            let expressProgress = 0;
            
            let strecke2Direction = true;
            let strecke2Progress = 0;

            // Vor dem Intervall einmalig die Gesamtlängen berechnen (sobald map existiert)
            const laengeStrecke1 = getRouteLengthInMeters(map, hbahnData.strecke1);
            const laengeStrecke2 = getRouteLengthInMeters(map, hbahnData.strecke2);

            setInterval(() => {
                // --- A. Berechnung für den Fahrplan-Waggon (Strecke 1) ---
                const jetzt = new Date();
                const sekunden = (jetzt.getMinutes() * 60) + jetzt.getSeconds();
                const fortschritt = sekunden % 600; // 10-Minuten-Umlauf
                let fahrplanPos, fahrplanText = "", statusInfo = "";

                if (fortschritt >= 0 && fortschritt < 120) {
                    // Hinfahrt: Interpolation über die gesamte Meter-Länge der Strecke
                    const meterFortschritt = (fortschritt / 120) * laengeStrecke1;
                    fahrplanPos = getPositionAtDistance(map, hbahnData.strecke1, meterFortschritt);
                    fahrplanText = "Unterwegs nach: <b>Campus Süd</b>";
                    statusInfo = "Fahrt nach Campus Süd 🟢";
                } else if (fortschritt >= 120 && fortschritt < 180) {
                    fahrplanPos = hbahnData.strecke1[hbahnData.strecke1.length - 1];
                    fahrplanText = "Halt in <b>Campus Süd</b><br>Fahrgastwechsel.";
                    statusInfo = "Halt am Campus 🟡";
                } else if (fortschritt >= 180 && fortschritt < 300) {
                    // Rückfahrt: Umgedrehte Route nutzen
                    const rueckfahrtRoute = [...hbahnData.strecke1].reverse();
                    const meterFortschritt = ((fortschritt - 180) / 120) * laengeStrecke1;
                    fahrplanPos = getPositionAtDistance(map, rueckfahrtRoute, meterFortschritt);
                    fahrplanText = "Unterwegs nach: <b>Eichlinghofen</b>";
                    statusInfo = "Fahrt nach Eichlinghofen 🟢";
                } else {
                    fahrplanPos = hbahnData.strecke1[0];
                    const restWartezeit = Math.ceil(600 - fortschritt);
                    fahrplanText = `Wartet in <b>Eichlinghofen</b>.<br>Nächste Abfahrt in: ${Math.floor(restWartezeit / 60)}m ${restWartezeit % 60}s`;
                    statusInfo = `Pause in Eichlinghofen (Abfahrt in ${Math.floor(restWartezeit / 60)}m) 🔵`;
                }
                
                fahrplanWaggon.setLatLng(fahrplanPos);
                fahrplanWaggon.getPopup().setContent(`<h3>🚟 Fahrplan-Waggon</h3>${fahrplanText}`);
                document.getElementById("mapStatus").innerHTML = `Fahrplan-Status: ${statusInfo}`;

                // --- B. Berechnung für den schnellen Express-Waggon (Strecke 1) ---
                // Erhöhung pro Schritt jetzt in echten Metern (z. B. 4 Meter pro 50ms = 80 m/s)
                if (expressDirection) {
                    expressProgress += 4; 
                    if (expressProgress >= laengeStrecke1) expressDirection = false;
                } else {
                    expressProgress -= 4;
                    if (expressProgress <= 0) expressDirection = true;
                }
                const expressPos = getPositionAtDistance(map, hbahnData.strecke1, expressProgress);
                expressWaggon.setLatLng(expressPos);
                expressWaggon.getPopup().setContent(`<h3>🚀 Express-Waggon</h3>Ziel: <b>${expressDirection ? "Campus Süd" : "Eichlinghofen"}</b>`);

                // --- C. Berechnung für den Waggon auf Strecke 2 ---
                if (hbahnData.strecke2 && hbahnData.strecke2.length > 1) {
                    if (strecke2Direction) {
                        strecke2Progress += 2.5; // Fährt 2.5 Meter pro Tick
                        if (strecke2Progress >= laengeStrecke2) strecke2Direction = false;
                    } else {
                        strecke2Progress -= 2.5;
                        if (strecke2Progress <= 0) strecke2Direction = true;
                    }
                    const s2Pos = getPositionAtDistance(map, hbahnData.strecke2, strecke2Progress);
                    strecke2Waggon.setLatLng(s2Pos);
                    strecke2Waggon.getPopup().setContent(`<h3>🚟 Strecke 2 Waggon</h3>Status: Pendelt auf neuer Route 🔄`);
                }

            }, 50);

            // ====================================================================
            // 5. ERWEITERTER RECHTSKLICK-LOGGER (JSON-FORMAT)
            // ====================================================================
            const loggerBox = document.getElementById("meinKartenLogger");
            const btnCopy = document.getElementById("btnCopyJson");
            const btnClear = document.getElementById("btnClearLogger");
            
            // Array, das alle geklickten Koordinaten zwischenspeichert
            let geklicktePunkte = [];

            map.on('contextmenu', function(e) {
                const lat = parseFloat(e.latlng.lat.toFixed(6));
                const lng = parseFloat(e.latlng.lng.toFixed(6));
                
                // Punkt im Array speichern
                geklicktePunkte.push([lat, lng]);
                
                // Formatiertes JSON in die Textarea schreiben (mit 2 Leerzeichen eingerückt)
                loggerBox.value = JSON.stringify(geklicktePunkte, null, 2);
                
                // Den einzelnen, neuesten Punkt direkt in die Zwischenablage legen
                navigator.clipboard.writeText(`[${lat}, ${lng}]`);
            });

            // Button: Kompletten Inhalt kopieren
            btnCopy.addEventListener("click", function() {
                if (geklicktePunkte.length === 0) {
                    alert("Die Sammelbox ist noch leer!");
                    return;
                }
                navigator.clipboard.writeText(loggerBox.value);
                
                // Visuelles Feedback auf dem Button
                const originalText = btnCopy.innerHTML;
                btnCopy.innerHTML = "✔ Kopiert!";
                btnCopy.style.backgroundColor = "#2ecc71";
                setTimeout(() => {
                    btnCopy.innerHTML = originalText;
                    btnCopy.style.backgroundColor = "#27ae60";
                }, 1500);
            });

            // Button: Box zurücksetzen
            btnClearLogger.addEventListener("click", function() {
                if (confirm("Möchtest du alle gesammelten Punkte wirklich löschen?")) {
                    geklicktePunkte = [];
                    loggerBox.value = "";
                }
            });
        });
    </script>
