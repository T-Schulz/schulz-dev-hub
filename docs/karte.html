<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund</title>
    
    <!-- HTTPS Leaflet CSS -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        #map {
            height: 400px !important;
            width: 100% !important;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1;
            background-color: #e5e3df !important;
        }
        
        /* DIAGNOSE KONSOLE STYLE */
        .console-box {
            background-color: #1e1e1e !important;
            color: #00ff00 !important;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund</h2>
            <div id="mapStatus" style="font-weight: bold; color: #e67e22; font-size: 0.9rem;">Status: Systemstart (v5.5.0)</div>
        </header>

        <div class="card">
            <div id="map"></div>
        </div>

        <!-- DIAGNOSE KONSOLE AUF DEM BILDSCHIRM -->
        <h3>💻 Live-Server-Konsole & Fehlerdiagnose</h3>
        <div class="console-box" id="debugConsole">
            [v5.5.0 System-Log initialisiert]<br>
        </div>
    </div>

    <!-- HTTPS Leaflet JS -->
    <script src="https://cloudflare.com"></script>
    <script>
        const osmKachelUrl = "https://openstreetmap.org{z}/{x}/{y}.png";
        const dortmundApiUrl = "https://opendatasoft.com";

        var map;

        // Hilfsfunktion zum Ausdrucken auf dem Bildschirm
        function printLog(text, farbe = "#00ff00") {
            const konsole = document.getElementById("debugConsole");
            if (konsole) {
                const zeit = new Date().toLocaleTimeString();
                konsole.innerHTML += `<span style="color: ${farbe}">[${zeit}] ${text}</span><br>`;
                konsole.scrollTop = konsole.scrollHeight; // Automatisch nach unten scrollen
            }
        }

        function initialisiereLeitstelle() {
            printLog("Starte Leaflet Karten-Initialisierung...", "#3498db");
            try {
                // 1. Karte anlegen
                map = L.map('map').setView([51.5136, 7.4653], 13);
                printLog("L.map('map') Objekt erfolgreich im Speicher angelegt ✔");
                
                // 2. Kacheln laden
                L.tileLayer(osmKachelUrl, {
                    attribution: '© OpenStreetMap'
                }).addTo(map);
                printLog("Kachel-Layer angefordert (URL: " + osmKachelUrl + ") ✔");

                // 3. Layout erzwingen
                setTimeout(function() {
                    map.invalidateSize();
                    printLog("map.invalidateSize() ausgeführt. Container-Größe aktualisiert ✔");
                    ladeParksensoren();
                }, 300);

            } catch (err) {
                printLog("KRITISCHER KARTEN-FEHLER: " + err.message, "#ff3333");
            }
        }

        async function ladeParksensoren() {
            const statusLabel = document.getElementById("mapStatus");
            printLog("Sende HTTPS-Fetch-Anfrage an Dortmund Open Data Portal...", "#3498db");
            printLog("Ziel-API: " + dortmundApiUrl, "#888");

            try {
                const response = await fetch(dortmundApiUrl);
                printLog(`Server-Antwort erhalten. HTTP-Status: ${response.status} (${response.statusText})`);
                
                // Wir lesen die Antwort zuerst als rohen Text aus!
                const roherText = await response.text();
                printLog("Rohe Server-Antwort (erste 150 Zeichen): " + roherText.substring(0, 150) + "...", "#f1c40f");

                // Erst jetzt parsen wir den Text zu JSON
                const data = JSON.parse(roherText);
                
                if (data.results && data.results.length > 0) {
                    printLog(`Erfolgreich ${data.results.length} IoT-Messwerte aus JSON extrahiert. Zeichne Marker...`);
                    data.results.forEach(record => {
                        if (record.geo_point_2d) {
                            L.marker([record.geo_point_2d.lat, record.geo_point_2d.lon]).addTo(map)
                             .bindPopup("<b>" + (record.parking_space_name || "IoT Stellplatz") + "</b>");
                        }
                    });
                    statusLabel.innerText = "Status: Live-Daten geladen ✔";
                    statusLabel.style.color = "#27ae60";
                    printLog("Dashboard voll funktionsfähig online! ✔", "#2ecc71");
                } else {
                    throw new Error("JSON enthält keine Datensätze im Feld 'results'.");
                }

            } catch (error) {
                printLog("NETZWERK- ODER API-ABRUCH: " + error.message, "#ff3333");
                printLog("Lade ausfallsichere Puffer-Marker...", "#e67e22");
                
                // Fallback Marker zeichnen
                const puffer = [
                    { lat: 51.5142, lon: 7.4661, name: "Stellplatz Wallring" },
                    { lat: 51.5121, lon: 7.4612, name: "Hauptbahnhof" }
                ];
                puffer.forEach(p => L.marker([p.lat, p.lon]).addTo(map).bindPopup(p.name));
                
                statusLabel.innerText = "Status: Puffer aktiv ⚠️";
                statusLabel.style.color = "#e67e22";
            }
        }

        // System starten, wenn das Dokument bereit ist
        window.onload = initialisiereLeitstelle;
    </script>
</body>
</html>
