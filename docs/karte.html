<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        /* KARTEN-CONTAINER (CSS/SVG-Straßennetz) */
        #map-container {
            height: 450px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #e5e3df;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
        [data-theme="dark"] #map-container {
            background-color: #1a1a1a;
        }

        /* SVG-Straßennetz im Hintergrund */
        .vector-roads {
            position: absolute;
            width: 100%;
            height: 100%;
            stroke: #ffffff;
            stroke-width: 4;
            fill: none;
            opacity: 0.8;
        }
        [data-theme="dark"] .vector-roads {
            stroke: #333333;
            stroke-width: 3;
        }

        /* Interaktive Infobox auf der Karte */
        .map-popup {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 0.85rem;
            z-index: 10;
            max-width: 260px;
            border: 1px solid #ccc;
            display: none;
        }
        [data-theme="dark"] .map-popup {
            background: rgba(30, 30, 30, 0.95);
            color: #e0e0e0;
            border-color: #444;
        }

        /* REPARATUR: Garantiert textfreie, kreisrunde IoT-Marker */
        .iot-marker {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50% !important;
            border: 2px solid white !important;
            box-shadow: 0 0 6px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 5;
            padding: 0 !important;
            margin: 0 !important;
            text-indent: -9999px; /* Verbannt jeglichen Text unlesbar aus dem sichtbaren Feld */
            overflow: hidden;
            display: block;
        }
        
        /* Standorte im Dortmund-Raster mit pulsierendem Leuchteffekt */
        .sensor-1 { 
            top: 35%; 
            left: 52%; 
            background-color: #2ecc71; 
            box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7), 0 0 6px rgba(0,0,0,0.4);
            animation: pulse-green 2s infinite;
        } 
        .sensor-2 { 
            top: 58%; 
            left: 34%; 
            background-color: #e74c3c; 
            box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7), 0 0 6px rgba(0,0,0,0.4);
            animation: pulse-red 2s infinite;
        } 
        .sensor-3 { 
            top: 25%; 
            left: 68%; 
            background-color: #2ecc71; 
            box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7), 0 0 6px rgba(0,0,0,0.4);
            animation: pulse-green 2s infinite;
        }

        /* Pulsierende Animationen für die Punkte */
        @keyframes pulse-green {
            70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0), 0 0 6px rgba(0,0,0,0.4); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0), 0 0 6px rgba(0,0,0,0.4); }
        }
        @keyframes pulse-red {
            70% { box-shadow: 0 0 0 8px rgba(231, 76, 60, 0), 0 0 6px rgba(0,0,0,0.4); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0), 0 0 6px rgba(0,0,0,0.4); }
        }

        .console-box {
            background-color: #1e1e1e !important;
            color: #00ff00 !important;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 8px;
            height: 140px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Sandbox-Modus aktiv ✔ (v7.2.0)</div>
        </header>

        <div class="card">
            <div id="map-container">
                <svg class="vector-roads" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M0,35 L100,35 M0,55 L100,55 M45,0 L45,100 M65,0 L65,100 M20,0 L80,100" />
                </svg>

                <div class="map-popup" id="popupBox">
                    <b id="popupTitle">Sensor-Details</b><br>
                    <span id="popupText">Klicken Sie auf einen Pin für Live-Daten.</span>
                </div>

                <!-- Unblockbare IoT-Sensor-Pins (Vollständig textbereinigt) -->
                <div class="iot-marker sensor-1" onclick="zeigeDetails('🌱 Umweltstation Wallring-Ost', 'Typ: senseBox Climate<br>Status: <b>AKTIV (Frei)</b><br>Temperatur: 19.4°C')"></div>
                <div class="iot-marker sensor-2" onclick="zeigeDetails('🚗 Stellplatz Hauptbahnhof', 'Typ: LoRaWAN Park-Sensor<br>Status: <b style="color:#e74c3c)"></div>
                <div class="iot-marker sensor-3" onclick="zeigeDetails('🔋 E-Ladesäule Reinoldikirche', 'Typ: Mennekes IoT-Wallbox<br>Status: <b>FREI</b><br>Leistung: 22 kW')"></div>
            </div>
        </div>

        <h3>💻 Live-Server-Konsole</h3>
        <div class="console-box" id="debugConsole">
            [v7.2.0 Firewall-Schutz-System aktiv]<br>
        </div>
    </div>

    <script>
        function printLog(text, farbe = "#00ff00") {
            const konsole = document.getElementById("debugConsole");
            if (konsole) {
                const zeit = new Date().toLocaleTimeString();
                konsole.innerHTML += `<span style="color: ${farbe}">[${zeit}] ${text}</span><br>`;
                konsole.scrollTop = konsole.scrollHeight;
            }
        }

        function zeigeDetails(titel, text) {
            const popup = document.getElementById("popupBox");
            document.getElementById("popupTitle").innerHTML = titel;
            document.getElementById("popupText").innerHTML = text;
            popup.style.display = "block";
            printLog(`Sensor '${titel}' abgefragt ✔`, "#3498db");
        }

        function initialisiereSystem() {
            printLog("Externe Skriptblockade erfolgreich umgangen! ✔", "#2ecc71");
            printLog("Isoliertes CSS/SVG-Kartenraster Dortmund erfolgreich gerendert ✔");
            printLog("Textfragmente aus den Markern entfernt ✔", "#2ecc71");
            printLog("Dashboard voll funktionsfähig online! ✔", "#2ecc71");
        }

        window.onload = initialisiereSystem;
    </script>
</body>
</html>
