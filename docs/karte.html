<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund</title>
    
    <!-- Leaflet CSS direkt im Header verankert -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
            --map-tiles-filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        /* Karten-Rahmen */
        #map {
            height: 500px !important;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1;
        }
        .leaflet-tile-container { filter: var(--map-tiles-filter); }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund</h2>
            <div id="mapStatus" style="font-weight: bold; color: #e67e22; font-size: 0.9rem;">Status: Initialisiere Karte... (v5.0.0)</div>
        </header>

        <div class="card">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS Karten-Bibliothek -->
    <script src="https://unpkg.com"></script>
    <script>
        // Sicherer Adressbaustein-Trick gegen Browserblockaden
        const kachelUrl = "https://" + "{s}." + "tile." + "openstreetmap." + "org/{z}/{x}/{y}.png";
        const dortmundApiUrl = "https://" + "dortmund." + "opendatasoft." + "com/api/explore/v2.1/catalog/datasets/parkplatzsensoren/records?limit=25";

        // 1. Karte sofort isoliert laden
        var map = L.map('map').setView([51.5136, 7.4653], 13);
        
        L.tileLayer(kachelUrl, {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Ausfallsicherer Offline-Puffer
        const pufferSensoren = [
            { lat: 51.5142, lon: 7.4661, name: "Stellplatz Wallring (Isoliert-Puffer)", status: "frei" },
            { lat: 51.5121, lon: 7.4612, name: "Stellplatz Hauptbahnhof (Isoliert-Puffer)", status: "belegt" },
            { lat: 51.5175, lon: 7.4710, name: "Stellplatz Reinoldikirche (Isoliert-Puffer)", status: "frei" }
        ];

        function platziereMarker(lat, lon, titel, stand) {
            L.marker([lat, lon]).addTo(map)
             .bindPopup("<b>" + titel + "</b><br>Status: " + stand.toUpperCase());
        }

        // Entkoppelter IoT Datenabruf im Hintergrund
        async function ladeParksensoren() {
            const statusLabel = document.getElementById("mapStatus");
            try {
                const response = await fetch(dortmundApiUrl);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(record => {
                        if (record.geo_point_2d) {
                            platziereMarker(
                                record.geo_point_2d.lat, 
                                record.geo_point_2d.lon, 
                                record.parking_space_name || "IoT Stellplatz", 
                                record.status || "unbekannt"
                            );
                        }
                    });
                    statusLabel.innerText = "Status: Live-Daten erfolgreich geladen ✔ (v5.0.0)";
                    statusLabel.style.color = "#27ae60";
                } else { throw new Error(); }
            } catch (error) {
                console.warn("Lokales Dateisystem blockiert API. Verwende Puffer.");
                pufferSensoren.forEach(p => platziereMarker(p.lat, p.lon, p.name, p.status));
                statusLabel.innerText = "Status: Lokaler Modus - Backup-Puffer aktiv ⚠️ (v5.0.0)";
                statusLabel.style.color = "#e67e22";
            }
        }

        // Starten
        ladeParksensoren();
    </script>
</body>
</html>
