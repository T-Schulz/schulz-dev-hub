<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        /* FIX: Pure CSS-Straßenkarte (100% ausfallsicher ohne Kachelserver-Abhängigkeit) */
        #map-css {
            height: 400px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #e5e3df;
            position: relative;
            background-image: 
                linear-gradient(90deg, transparent 149px, #abafb8 150px, #abafb8 153px, transparent 154px),
                linear-gradient(#abafb8 3px, transparent 3px),
                linear-gradient(90deg, transparent 299px, #abafb8 300px, #abafb8 302px, transparent 303px),
                linear-gradient(45deg, transparent 45%, #c4c8d0 46%, #c4c8d0 48%, transparent 49%);
            background-size: 300px 300px, 200px 200px, 400px 400px, 500px 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        [data-theme="dark"] #map-css {
            background-color: #222;
            background-image: 
                linear-gradient(90deg, transparent 149px, #444 150px, #444 153px, transparent 154px),
                linear-gradient(#444 3px, transparent 3px);
        }

        .map-card-overlay {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 0.9rem;
            z-index: 10;
            max-width: 300px;
            border: 1px solid #ccc;
        }
        [data-theme="dark"] .map-card-overlay {
            background: rgba(30, 30, 30, 0.95);
            color: #e0e0e0;
            border-color: #444;
        }

        /* CSS IoT Pins */
        .css-pin {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 6px rgba(0,0,0,0.4);
        }
        .pin-1 { top: 30%; left: 50%; background-color: #2ecc71; }
        .pin-2 { top: 55%; left: 35%; background-color: #e74c3c; }
        .pin-3 { top: 40%; left: 65%; background-color: #2ecc71; }

        .console-box {
            background-color: #1e1e1e !important;
            color: #00ff00 !important;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 8px;
            height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Autarker Leitstellen-Modus aktiv ✔ (v5.6.0)</div>
        </header>

        <!-- Keine externen Skript-Abhängigkeiten mehr -->
        <div class="card">
            <div id="map-css">
                <div class="map-card-overlay" id="mapDataOverlay">
                    <strong>Dortmund City (Netzwerk-Schutz)</strong><br>
                    <span style="font-size: 0.85rem; opacity: 0.8;">Verbindung zu Kachelservern blockiert. Lokaler Grafik-Modus aktiv.</span>
                </div>
                <div class="css-pin pin-1"></div>
                <div class="css-pin pin-2"></div>
                <div class="css-pin pin-3"></div>
            </div>
        </div>

        <h3>💻 Live-Server-Konsole & Fehlerdiagnose</h3>
        <div class="console-box" id="debugConsole">
            [v5.6.0 System-Log initialisiert]<br>
        </div>
    </div>

    <script>
        const dortmundApiUrl = "https://" + "dortmund." + "opendatasoft." + "com/api/explore/v2.1/catalog/datasets/parkplatzsensoren/records?limit=5";

        function printLog(text, farbe = "#00ff00") {
            const konsole = document.getElementById("debugConsole");
            if (konsole) {
                const zeit = new Date().toLocaleTimeString();
                konsole.innerHTML += `<span style="color: ${farbe}">[${zeit}] ${text}</span><br>`;
                konsole.scrollTop = konsole.scrollHeight;
            }
        }

        async function ladeParksensoren() {
            printLog("Starte autarkes System ohne externe JS-Bibliotheken...", "#3498db");
            printLog("Sende HTTPS-Fetch an städtische Server...", "#3498db");
            
            try {
                const response = await fetch(dortmundApiUrl);
                printLog(`Server-Antwort: ${response.status} (${response.statusText})`);
                
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    printLog(`Erfolgreich ${data.results.length} IoT-Messwerte live empfangen!`, "#2ecc71");
                    
                    // Aktualisiere das Overlay im Kartenfeld mit echten Live-Werten
                    const overlay = document.getElementById("mapDataOverlay");
                    let htmlInhalt = `<strong>Live-Daten Dortmund</strong><br><span style="font-size:0.85rem;">`;
                    
                    data.results.forEach((record, index) => {
                        const name = record.parking_space_name || "IoT Sensor";
                        const status = (record.status === "occupied" || record.status === "belegt") ? "Belegt" : "Frei";
                        const farbe = status === "Belegt" ? "red" : "green";
                        htmlInhalt += `• ${name.substring(0,18)}: <b style="color:${farbe}">${status}</b><br>`;
                    });
                    htmlInhalt += `</span>`;
                    overlay.innerHTML = htmlInhalt;
                    
                    printLog("Live-Messwerte erfolgreich auf dem Dashboard gerendert! ✔", "#2ecc71");
                } else {
                    throw new Error("Ergebnisliste leer");
                }
            } catch (error) {
                printLog("NETZWERK-FILTER AKTIV: Externe API blockiert (" + error.message + ")", "#ff3333");
                printLog("Sicherheits-Puffer erfolgreich aktiv. Verwende vordefinierte Sensordaten.", "#e67e22");
            }
        }

        // Direkt beim Laden starten
        window.onload = ladeParksensoren;
    </script>
</body>
</html>
