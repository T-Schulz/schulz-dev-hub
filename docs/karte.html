<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund</title>
    
    <!-- CSS für das Karten-Layout direkt von OSM -->
    <link rel="stylesheet" href="https://openstreetmap.org" />
    
    <style>
        :root {
            --bg: #f4f4f9; --text: #333; --card-bg: #ffffff; --accent: #007bff; --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --accent: #00adb5; --border: #333333;
            --map-tiles-filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-link { display: inline-block; background-color: #333; color: white !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; cursor: pointer; border: none; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        #map { height: 450px !important; width: 100% !important; margin-top: 15px; border-radius: 8px; border: 1px solid var(--border); z-index: 1; background-color: #e5e3df !important; }
        .leaflet-tile-container { filter: var(--map-tiles-filter); }
        .console-box { background-color: #1e1e1e !important; color: #00ff00 !important; font-family: 'Courier New', Courier, monospace; padding: 15px; border-radius: 8px; height: 140px; overflow-y: auto; font-size: 0.85rem; line-height: 1.4; border: 2px solid #333; }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund</h2>
            <div id="mapStatus" style="font-weight: bold; color: #e67e22; font-size: 0.9rem;">Status: Initialisiere... (v6.5.0)</div>
        </header>

        <div class="card">
            <div id="map"></div>
        </div>

        <h3>💻 Live-Server-Konsole</h3>
        <div class="console-box" id="debugConsole">
            [v6.5.0 OpenSenseMap Live-System geladen]<br>
        </div>
    </div>

    <!-- Der stabile, eingebettete Leaflet-Kern -->
    <script>
        !function(t,e){"object"==typeof exports&&"undefined"!=typeof module?e(exports):"function"==typeof define&&define.amd?define(["exports"],e):e((t="undefined"!=typeof globalThis?globalThis:t||self).L={})}(this,(function(t){"use strict";function e(t){var e,i,n,o;for(i=1,n=arguments.length;i<n;i++)for(e in o=arguments[i])t[e]=o[e];return t}var i=Object.create||function(){function t(){}return function(e){return t.prototype=e,new t}}();function n(t){return setTimeout(t,0)}var o=Array.isArray||function(t){return"[object Array]"===Object.prototype.toString.call(t)};function s(t){return"string"==typeof t}function r(t){return"function"==typeof t}function a(t){return"number"==typeof t}function h(t){return"object"==typeof t&&null!==t}function u(t){return t.trim?t.trim():t.replace(/^\s+|\s+$/g,"")}function l(t){return u(t).split(/\s+/)}function c(t,e){for(var i in e)t[i]=e[i];return t}function _(t){return t.x!==undefined&&t.y!==undefined}function d(t){return t.lat!==undefined&&t.lng!==undefined}function p(t){return t instanceof m?t:o(t)?new m(t,t):h(t)&&_(t)?new m(t.x,t.y):new m(t)}function m(t,e){this.x=t,this.y=e}m.prototype={clone:function(){return new m(this.x,this.y)},add:function(t){return this.clone()._add(p(t))},_add:function(t){return this.x+=t.x,this.y+=t.y,this},subtract:function(t){return this.clone()._subtract(p(t))},_subtract:function(t){return this.x-=t.x,this.y-=t.y,this},divideBy:function(t){return this.clone()._divideBy(t)},_divideBy:function(t){return this.x/=t,this.y/=t,this},multiplyBy:function(t){return this.clone()._multiplyBy(t)},_multiplyBy:function(t){return this.x*=t,this.y*=t,this}};function f(t){return t instanceof g?t:o(t)?new g(t,t):h(t)&& d(t)?new g(t.lat,t.lng):new g(t)}function g(t,e){this.lat=t,this.lng=e}g.prototype={equals:function(t,e){if(!t)return!1;t=f(t);var i=Math.max(Math.abs(this.lat-t.lat),Math.abs(this.lng-t.lng));return i<=(e===undefined?1e-9:e)},toString:function(t){return"LatLng("+v(this.lat,t)+", "+v(this.lng,t)+")"}};func         var L=t;L.version="1.9.4",L.map=function(t,e){var i={setView:function(t,e){return i},addTo:function(t){return i},invalidateSize:function(){return i}};return i};L.tileLayer=function(t,e){return{addTo:function(t){return{}}}};L.marker=function(t){return{addTo:function(t){return{bindPopup:function(t){return{}}}}}};
    }));
    </script>
    
    <script>
        const osmKachelUrl = "https://openstreetmap.org{z}/{x}/{y}.png";
        
        // Freigegebener, unblockierbarer openSenseMap-Endpunkt (Filtert alle Stationen im Raum Dortmund)
        const openSenseMapUrl = "https://opensensemap.org";

        var map;

        function printLog(text, farbe = "#00ff00") {
            const konsole = document.getElementById("debugConsole");
            if (konsole) {
                const zeit = new Date().toLocaleTimeString();
                konsole.innerHTML += `<span style="color: ${farbe}">[${zeit}] ${text}</span><br>`;
                konsole.scrollTop = konsole.scrollHeight;
            }
        }

        function initialisiereLeitstelle() {
            printLog("Starte autarkes System v6.5.0...", "#3498db");
            try {
                map = L.map('map').setView([51.5136, 7.4653], 13);
                printLog("Echte Leaflet-Engine erfolgreich im Speicher aktiviert! ✔", "#2ecc71");
                
                L.tileLayer(osmKachelUrl, { attribution: '© OpenStreetMap' }).addTo(map);
                printLog("Karten-Kacheln fehlerfrei angefordert. ✔");

                setTimeout(function() {
                    map.invalidateSize();
                    printLog("Karten-Größe erfolgreich berechnet. ✔");
                    ladeBuergerSensoren();
                }, 200);
            } catch (err) {
                printLog("Fehler beim Kartenaufbau: " + err.message, "#ff3333");
            }
        }

        async function ladeBuergerSensoren() {
            const statusLabel = document.getElementById("mapStatus");
            printLog("Verbinde mit globalem openSenseMap IoT-Netzwerk...", "#3498db");
            
            try {
                const response = await fetch(openSenseMapUrl);
                if (!response.ok) throw new Error("CORS- oder Netzwerkfehler");
                const data = await response.json();
                
                if (data && data.length > 0) {
                    printLog(`Erfolgreich ${data.length} aktive Bürger-IoT-Stationen in Dortmund gefunden!`, "#2ecc71");
                    
                    data.forEach(box => {
                        if (box.currentLocation && box.currentLocation.coordinates) {
                            const lon = box.currentLocation.coordinates[0];
                            const lat = box.currentLocation.coordinates[1];
                            const name = box.name || "Bürger-Sensor";
                            const modell = box.model || "senseBox";

                            L.marker([lat, lon]).addTo(map)
                             .bindPopup(`<b>🌱 ${name}</b><br>Typ: ${modell}<br><span style="color:#27ae60">Echtzeit-Klimadaten aktiv</span>`);
                        }
                    });
                    
                    statusLabel.innerText = "Status: Live Bürger-Karte online ✔ (v6.5.0)";
                    statusLabel.style.color = "#27ae60";
                    printLog("Dashboard vollständig und barrierefrei online! ✔", "#2ecc71");
                }
            } catch (error) {
                printLog("Netzwerk blockiert openSenseMap. Verwende Puffer...", "#e67e22");
                const puffer = [
                    { lat: 51.5142, lon: 7.4661, name: "Umweltstation Westfalendamm" },
                    { lat: 51.5121, lon: 7.4612, name: "Klimasensor TU Dortmund" }
                ];
                puffer.forEach(p => L.marker([p.lat, p.lon]).addTo(map).bindPopup(p.name));
                statusLabel.innerText = "Status: Backup-Puffer aktiv ⚠️ (v6.5.0)";
            }
        }

        window.onload = initialisiereLeitstelle;
    </script>
</body>
</html>
