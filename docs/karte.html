<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund</title>
    
    <!-- CSS für das Karten-Layout -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    
    <style>
        :root {
            --bg: #f4f4f9; --text: #333; --card-bg: #ffffff; --accent: #007bff; --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --accent: #00adb5; --border: #333333;
            --map-tiles-filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-link { display: inline-block; background-color: #333; color: white !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; cursor: pointer; border: none; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        #map { height: 450px !important; width: 100% !important; margin-top: 15px; border-radius: 8px; border: 1px solid var(--border); z-index: 1; background-color: #e5e3df !important; }
        .leaflet-tile-container { filter: var(--map-tiles-filter); }
        .console-box { background-color: #1e1e1e !important; color: #00ff00 !important; font-family: 'Courier New', Courier, monospace; padding: 15px; border-radius: 8px; height: 140px; overflow-y: auto; font-size: 0.85rem; line-height: 1.4; border: 2px solid #333; }
    </style>
</head>

    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund</h2>
            <div id="mapStatus" style="font-weight: bold; color: #e67e22; font-size: 0.9rem;">Status: Initialisiere... (v6.4.0)</div>
        </header>

        <div class="card">
            <div id="map"></div>
        </div>

        <h3>💻 Live-Server-Konsole</h3>
        <div class="console-box" id="debugConsole">
            [v6.4.0 Voll-Autarkes System geladen]<br>

    </div>

    <script>
        const osmKachelUrl = "https://openstreetmap.org{z}/{x}/{y}.png";
        const dortmundApiUrl = "https://opendatasoft.com";

        var map;

        function printLog(text, farbe = "#00ff00") {
            const konsole = document.getElementById("debugConsole");
            if (konsole) {
                const zeit = new Date().toLocaleTimeString();
                konsole.innerHTML += `<span style="color: ${farbe}">[${zeit}] ${text}</span><br>`;
                konsole.scrollTop = konsole.scrollHeight;
            }
        }

        function initialisiereLeitstelle() {
            printLog("Starte autarkes System v6.4.0...", "#3498db");
            
            try {
                // Initialisiert das eingebettete Kartensystem
                map = L.map('map').setView([51.5136, 7.4653], 13);
                printLog("Echte Leaflet-Engine erfolgreich im Speicher aktiviert! ✔", "#2ecc71");
                
                L.tileLayer(osmKachelUrl, { attribution: '© OpenStreetMap' }).addTo(map);
                printLog("Karten-Kacheln fehlerfrei angefordert. ✔");

                setTimeout(function() {
                    map.invalidateSize();
                    printLog("Karten-Größe erfolgreich berechnet. ✔");
                    ladeParksensoren();
                }, 200);

            } catch (err) {
                printLog("Fehler beim Kartenaufbau: " + err.message, "#ff3333");
            }
        }

        async function ladeParksensoren() {
            const statusLabel = document.getElementById("mapStatus");
            printLog("Sende HTTPS-Fetch an städtische Server...", "#3498db");
            
            const puffer = [
                { lat: 51.5142, lon: 7.4661, name: "Stellplatz Wallring (Backup)" },
                { lat: 51.5121, lon: 7.4612, name: "Stellplatz Hauptbahnhof (Backup)" }
            ];

            try {
                const response = await fetch(dortmundApiUrl);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    printLog(`Erfolgreich ${data.results.length} Live-Sensoren aus Dortmund empfangen!`, "#2ecc71");
                    
                    data.results.forEach(record => {
                        if (record.geo_point_2d) {
                            const statusText = (record.status === "occupied" || record.status === "belegt") ? "BELEGT" : "FREI";
                            L.marker([record.geo_point_2d.lat, record.geo_point_2d.lon]).addTo(map)
                             .bindPopup(`<b>${record.parking_space_name || 'IoT Stellplatz'}</b><br>Status: ${statusText}`);
                        }
                    });
                    
                    statusLabel.innerText = "Status: Live-Karte online ✔ (v6.4.0)";
                    statusLabel.style.color = "#27ae60";
                    printLog("Smart City Leitstelle erfolgreich online! ✔", "#2ecc71");
                }
            } catch (error) {
                printLog("API blockiert, lade Puffer-Marker...", "#e67e22");
                puffer.forEach(p => L.marker([p.lat, p.lon]).addTo(map).bindPopup(p.name));
                statusLabel.innerText = "Status: Backup-Puffer aktiv ⚠️ (v6.4.0)";
            }
        }

        window.onload = initialisiereLeitstelle;
    </script>

    <script src="https://openstreetmap.org"></script>
    
    <script>
        const osmKachelUrl = "https://openstreetmap.org{z}/{x}/{y}.png";
        const dortmundApiUrl = "https://opendatasoft.com";

        var map;

        function printLog(text, farbe = "#00ff00") {
            const konsole = document.getElementById("debugConsole");
            if (konsole) {
                const zeit = new Date().toLocaleTimeString();
                konsole.innerHTML += `<span style="color: ${farbe}">[${zeit}] ${text}</span><br>`;
                konsole.scrollTop = konsole.scrollHeight;
            }
        }

        function initialisiereLeitstelle() {
            printLog("Starte echten Leitstellen-Modus v6.3.0...", "#3498db");
            
            if (typeof L === 'undefined') {
                printLog("Fehler: Leaflet-Engine konnte nicht über OSM geladen werden.", "#ff3333");
                return;
            }

            try {
                // Initialisiert die echte interaktive Karte
                map = L.map('map').setView([51.5136, 7.4653], 13);
                printLog("Echtes L.map() Objekt erfolgreich initialisiert! ✔", "#2ecc71");
                
                L.tileLayer(osmKachelUrl, {
                    attribution: '© OpenStreetMap'
                }).addTo(map);
                printLog("Interaktive Bildkacheln erfolgreich eingebunden. ✔");

                setTimeout(function() {
                    map.invalidateSize();
                    printLog("Karten-Größe erfolgreich berechnet. ✔");
                    ladeParksensoren();
                }, 300);

            } catch (err) {
                printLog("Fehler beim Kartenaufbau: " + err.message, "#ff3333");
            }
        }

        async function ladeParksensoren() {
            const statusLabel = document.getElementById("mapStatus");
            printLog("Sende HTTPS-Fetch an städtische Server...", "#3498db");
            
            // Ausfallsichere Puffer-Marker, falls das Opendata-Portal Dortmund blockiert
            const puffer = [
                { lat: 51.5142, lon: 7.4661, name: "Stellplatz Wallring (Puffer)" },
                { lat: 51.5121, lon: 7.4612, name: "Stellplatz Hauptbahnhof (Puffer)" },
                { lat: 51.5175, lon: 7.4710, name: "Stellplatz Reinoldikirche (Puffer)" }
            ];

            try {
                const response = await fetch(dortmundApiUrl);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    printLog(`Erfolgreich ${data.results.length} Live-Sensoren aus Dortmund empfangen! Zeichne Punkte...`, "#2ecc71");
                    
                    data.results.forEach(record => {
                        if (record.geo_point_2d) {
                            const statusText = (record.status === "occupied" || record.status === "belegt") ? "BELEGT" : "FREI";
                            L.marker([record.geo_point_2d.lat, record.geo_point_2d.lon]).addTo(map)
                             .bindPopup(`<b>${record.parking_space_name || 'IoT Stellplatz'}</b><br>Status: ${statusText}`);
                        }
                    });
                    
                    statusLabel.innerText = "Status: Live-Karte online ✔ (v6.3.0)";
                    statusLabel.style.color = "#27ae60";
                    printLog("Smart City Leitstelle erfolgreich online! ✔", "#2ecc71");
                } else {
                    throw new Error("API-Ergebnis leer");
                }
            } catch (error) {
                printLog("API blockiert oder offline. Zeichne Puffer-Marker...", "#e67e22");
                puffer.forEach(p => {
                    L.marker([p.lat, p.lon]).addTo(map)
                     .bindPopup(`<b>${p.name}</b><br>Status: BACKUP`);
                });
                statusLabel.innerText = "Status: Backup-Puffer aktiv ⚠️ (v6.3.0)";
                statusLabel.style.color = "#e67e22";
            }
        }

        window.onload = initialisiereLeitstelle;
    </script>
