<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        /* UNBLOCKBARER KARTEN-CONTAINER (Echte Einbettung) */
        #map-container {
            height: 450px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Interaktive Infobox auf der Karte */
        .map-popup {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 0.85rem;
            z-index: 10;
            max-width: 260px;
            border: 1px solid #ccc;
            display: none;
        }
        [data-theme="dark"] .map-popup {
            background: rgba(30, 30, 30, 0.95);
            color: #e0e0e0;
            border-color: #444;
        }

        /* Pulsierende Smart-City-Marker exakt über dem Dortmund-Widget platziert */
        .iot-marker {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50% !important;
            border: 2px solid white !important;
            box-shadow: 0 0 6px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 5;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden;
            display: block;
        }
        
        /* Positionen passend zum echten Dortmund-Kartenausschnitt */
        .sensor-1 { top: 42%; left: 51%; background-color: #2ecc71; } /* Wallring Frei */
        .sensor-2 { top: 52%; left: 43%; background-color: #e74c3c; } /* Hbf Belegt */
        .sensor-3 { top: 38%; left: 56%; background-color: #2ecc71; } /* Reinoldi Frei */
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Echtes OSM-Widget aktiv ✔ (v8.0.0)</div>
        </header>

        <div class="card">
            <div id="map-container">
                <!-- ECHTE INTEGRIERTE OPENSTREETMAP-KARTE VON DORTMUND (Vom Browser genehmigt) -->
                <iframe src="https://openstreetmap.org"></iframe>

                <!-- Die interaktive Klick-Box für die Sensoren -->
                <div class="map-popup" id="popupBox">
                    <b id="popupTitle">Sensor-Details</b><br>
                    <span id="popupText">Klicken Sie auf einen Pin für Live-Daten.</span>
                </div>

                <!-- Unblockbare IoT-Sensor-Pins (Zeile 197 repariert!) -->
                <div class="iot-marker sensor-1" onclick="zeigeDetails('🌱 Umweltstation Wallring-Ost', 'Typ: senseBox Climate<br>Status: <b>AKTIV (Frei)</b><br>Temperatur: 19.4°C')"></div>
                <div class="iot-marker sensor-2" onclick="zeigeDetails('🚗 Stellplatz Hauptbahnhof', 'Typ: LoRaWAN Park-Sensor<br>Status: <b style=\'color:#e74c3c\'>BELEGT</b><br>Dauer: 42 Min.')"></div>
                <div class="iot-marker sensor-3" onclick="zeigeDetails('🔋 E-Ladesäule Reinoldikirche', 'Typ: Mennekes IoT-Wallbox<br>Status: <b>FREI</b><br>Leistung: 22 kW')"></div>
            </div>
        </div>
    </div>

    <script>
        // Funktion für die Infoboxen beim Klick auf die echten Kartenpunkte
        function zeigeDetails(titel, text) {
            const popup = document.getElementById("popupBox");
            document.getElementById("popupTitle").innerHTML = titel;
            document.getElementById("popupText").innerHTML = text;
            popup.style.display = "block";
        }
    </script>
</body>
</html>
