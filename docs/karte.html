<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund</title>
    
    <!-- ERZWUNGEN: Absolut sicheres HTTPS Leaflet CSS -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
            --map-tiles-filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .btn-test {
            background-color: #e67e22;
            margin-left: 10px;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        /* Festes Karten-Layout */
        #map {
            height: 500px !important;
            width: 100% !important;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1;
            background-color: #e5e3df !important;
        }
        .leaflet-tile-container { filter: var(--map-tiles-filter); }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        <button class="btn-link btn-test" id="btnAlternative">Alternative Karte laden 🔄</button>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund</h2>
            <div id="mapStatus" style="font-weight: bold; color: #e67e22; font-size: 0.9rem;">Status: Initialisiere Karte... (v5.4.0)</div>
        </header>

        <div class="card">
            <div id="map"></div>
        </div>
    </div>

    <!-- ERZWUNGEN: Absolut sicheres HTTPS Leaflet JS Skript -->
    <script src="https://cloudflare.com"></script>
    <script>
        // KORREKTUR: Knallharte, erzwungene HTTPS-Zuweisung, um "Mixed Content" auf GitHub Pages zu verhindern
        const osmKachelUrl = "https://openstreetmap.org{z}/{x}/{y}.png";
        const alternativeKachelUrl = "https://cartocdn.com{z}/{x}/{y}.png";
        const dortmundApiUrl = "https://opendatasoft.com";

        var map;
        var kachelSchicht;

        const pufferSensoren = [
            { lat: 51.5142, lon: 7.4661, name: "Stellplatz Wallring (Backup)", status: "frei" },
            { lat: 51.5121, lon: 7.4612, name: "Stellplatz Hauptbahnhof (Backup)", status: "belegt" },
            { lat: 51.5175, lon: 7.4710, name: "Stellplatz Reinoldikirche (Backup)", status: "frei" }
        ];

        function platziereMarker(lat, lon, titel, stand) {
            L.marker([lat, lon]).addTo(map)
             .bindPopup("<b>" + titel + "</b><br>Status: " + stand.toUpperCase());
        }

        function initialisiereLeitstelle() {
            // Karte anlegen
            map = L.map('map').setView([51.5136, 7.4653], 13);
            
            // OSM laden
            kachelSchicht = L.tileLayer(osmKachelUrl, {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Größe neu berechnen
            setTimeout(function() {
                map.invalidateSize();
                ladeParksensoren();
            }, 300);
        }

        // Event-Listener für den Alternativ-Button
        document.getElementById("btnAlternative").addEventListener("click", function() {
            const statusLabel = document.getElementById("mapStatus");
            try {
                map.removeLayer(kachelSchicht);
                kachelSchicht = L.tileLayer(alternativeKachelUrl, {
                    attribution: '© CARTO'
                }).addTo(map);
                map.invalidateSize();
                statusLabel.innerText = "Status: Sichere HTTPS-Alternativkarte aktiv (v5.4.0)";
                statusLabel.style.color = "#007bff";
            } catch(e) {
                console.error(e);
            }
        });

        async function ladeParksensoren() {
            const statusLabel = document.getElementById("mapStatus");
            try {
                const response = await fetch(dortmundApiUrl);
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(record => {
                        if (record.geo_point_2d) {
                            platziereMarker(
                                record.geo_point_2d.lat, 
                                record.geo_point_2d.lon, 
                                record.parking_space_name || "IoT Stellplatz", 
                                record.status || "unbekannt"
                            );
                        }
                    });
                    statusLabel.innerText = "Status: Live-Daten erfolgreich über HTTPS geladen ✔ (v5.4.0)";
                    statusLabel.style.color = "#27ae60";
                } else { throw new Error(); }
            } catch (error) {
                pufferSensoren.forEach(p => platziereMarker(p.lat, p.lon, p.name, p.status));
                statusLabel.innerText = "Status: Backup-Puffer über HTTPS aktiv ⚠️ (v5.4.0)";
                statusLabel.style.color = "#e67e22";
            }
        }

        window.onload = initialisiereLeitstelle;
    </script>
</body>
</html>
