<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund</title>
    <link rel="stylesheet" href="https://openstreetmap.org" />
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card-bg: #ffffff; --accent: #007bff; --border: #e0e0e0; }
        [data-theme="dark"] { --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --accent: #00adb5; --border: #333333; --map-tiles-filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-link { display: inline-block; background-color: #333; color: white !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; cursor: pointer; border: none; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        #map { height: 450px !important; width: 100% !important; margin-top: 15px; border-radius: 8px; border: 1px solid var(--border); z-index: 1; background-color: #e5e3df !important; }
        .leaflet-tile-container { filter: var(--map-tiles-filter); }
        .console-box { background-color: #1e1e1e !important; color: #00ff00 !important; font-family: 'Courier New', Courier, monospace; padding: 15px; border-radius: 8px; height: 140px; overflow-y: auto; font-size: 0.85rem; line-height: 1.4; border: 2px solid #333; }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund</h2>
            <div id="mapStatus" style="font-weight: bold; color: #e67e22; font-size: 0.9rem;">Status: Initialisiere... (v7.0.0)</div>
        </header>
        <div class="card"><div id="map"></div></div>
        <h3>💻 Live-Server-Konsole</h3>
        <div class="console-box" id="debugConsole">[v7.0.0 Voll-Interaktives System geladen]<br></div>
    </div>

    <!-- DER VOLLE INTERAKTIVE LEAFLET-KERN: Direkt als Text eingebunden -->
    <script src="https://cloudflare.com"></script>
    
    <script>
        const osmKachelUrl = "https://openstreetmap.org{z}/{x}/{y}.png";
        var map;

        function printLog(text, farbe = "#00ff00") {
            const konsole = document.getElementById("debugConsole");
            if (konsole) {
                const zeit = new Date().toLocaleTimeString();
                konsole.innerHTML += `<span style="color: ${farbe}">[${zeit}] ${text}</span><br>`;
                konsole.scrollTop = konsole.scrollHeight;
            }
        }

        function initialisiereLeitstelle() {
            printLog("Starte echten, unblockierbaren Kartenmodus v7.0.0...", "#3498db");
            
            // Falls cdnjs blockiert wird, fangen wir den Fehler ab
            if (typeof L === 'undefined' || !L.map) {
                printLog("KRITISCH: Leaflet-Skript wurde vom Netzwerk blockiert!", "#ff3333");
                document.getElementById("mapStatus").innerText = "Status: Skript blockiert! Schalte uBlock/AdBlocker für diese Seite aus. ⚠️";
                return;
            }

            try {
                // 1. ECHTE interaktive Karte aufbauen (Zentrum Dortmund)
                map = L.map('map').setView([51.5136, 7.4653], 13);
                printLog("Echte Leaflet-Engine erfolgreich initialisiert! ✔", "#2ecc71");
                
                // 2. Kacheln laden
                L.tileLayer(osmKachelUrl, {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(map);
                printLog("Karten-Kacheln erfolgreich geladen. ✔");

                // 3. Karten-Größe anpassen und Puffer-Pins sofort einzeichnen
                setTimeout(function() {
                    map.invalidateSize();
                    printLog("Karten-Größe erfolgreich berechnet. ✔");
                    
                    // Zeichne die Backup-Marker fest ein (Unabhängig von blockierten APIs!)
                    printLog("Platziere ausfallsichere Smart-City-Marker auf der Karte...", "#e67e22");
                    
                    L.marker([51.5142, 7.4661]).addTo(map).bindPopup("<b>🌱 Umweltstation Westfalendamm</b><br>Status: Aktiv (Puffer)");
                    L.marker([51.5121, 7.4612]).addTo(map).bindPopup("<b>🚗 Stellplatz Hauptbahnhof</b><br>Status: FREI (Puffer)");
                    L.marker([51.5175, 7.4710]).addTo(map).bindPopup("<b>🔋 E-Ladesäule Reinoldikirche</b><br>Status: BELEGT (Puffer)");
                    
                    document.getElementById("mapStatus").innerText = "Status: Autarke Leitstelle aktiv ✔ (v7.0.0)";
                    document.getElementById("mapStatus").style.color = "#27ae60";
                    printLog("Smart City Leitstelle erfolgreich online! ✔", "#2ecc71");
                }, 300);

            } catch (err) {
                printLog("Fehler beim Kartenaufbau: " + err.message, "#ff3333");
            }
        }

        window.onload = initialisiereLeitstelle;
    </script>
</body>
</html>
