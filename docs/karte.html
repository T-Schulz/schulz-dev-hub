<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        /* UNBLOCKBARER KARTEN-CONTAINER (Reines CSS/SVG-Straßennetz) */
        #map-container {
            height: 450px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #e5e3df;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
        [data-theme="dark"] #map-container {
            background-color: #1a1a1a;
        }

        /* SVG-Straßennetz im Hintergrund */
        .vector-roads {
            position: absolute;
            width: 100%;
            height: 100%;
            stroke: #ffffff;
            stroke-width: 4;
            fill: none;
            opacity: 0.8;
        }
        [data-theme="dark"] .vector-roads {
            stroke: #333333;
            stroke-width: 3;
        }

        /* Interaktive Infobox auf der Karte */
        .map-popup {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 0.85rem;
            z-index: 10;
            max-width: 260px;
            border: 1px solid #ccc;
            display: none; /* Wird per Klick aktiv */
        }
        [data-theme="dark"] .map-popup {
            background: rgba(30, 30, 30, 0.95);
            color: #e0e0e0;
            border-color: #444;
        }

        /* Pulsierende Smart-City-Marker */
        .iot-marker {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 6px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 5;
        }
        .iot-marker:hover {
            transform: scale(1.3);
        }
        
        /* Standorte der Puffer-Sensoren im Dortmunder Raster */
        .sensor-1 { top: 35%; left: 52%; background-color: #2ecc71; } /* Wallring Frei */
        .sensor-2 { top: 58%; left: 34%; background-color: #e74c3c; } /* Hbf Belegt */
        .sensor-3 { top: 25%; left: 68%; background-color: #2ecc71; } /* Reinoldi Frei */

        .console-box {
            background-color: #1e1e1e !important;
            color: #00ff00 !important;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 8px;
            height: 140px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
            border: 2px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Sandbox-Modus aktiv ✔ (v7.1.0)</div>
        </header>

        <div class="card">
            <div id="map-container">
                <!-- Vektorbasiertes Straßennetz von Dortmund (Wird lokal gerendert) -->
                <svg class="vector-roads" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M0,35 L100,35 M0,55 L100,55 M45,0 L45,100 M65,0 L65,100 M20,0 L80,100" />
                </svg>

                <!-- Die interaktive Klick-Box für die Sensoren -->
                <div class="map-popup" id="popupBox">
                    <b id="popupTitle">Sensor-Details</b><br>
                    <span id="popupText">Klicken Sie auf einen Pin für Live-Daten.</span>
                </div>

                <!-- Unblockbare IoT-Sensor-Pins -->
                <div class="iot-marker sensor-1" onclick="zeigeDetails('🌱 Umweltstation Wallring-Ost', 'Typ: senseBox Climate<br>Status: <b>AKTIV (Frei)</b><br>Temperatur: 19.4°C')"></div>
                <div class="iot-marker sensor-2" onclick="zeigeDetails('🚗 Stellplatz Hauptbahnhof', 'Typ: LoRaWAN Park-Sensor<br>Status: <b style="color:#e74c3c">BELEGT</b><br>Dauer: 42 Min.')"></div>
                <div class="iot-marker sensor-3" onclick="zeigeDetails('🔋 E-Ladesäule Reinoldikirche', 'Typ: Mennekes IoT-Wallbox<br>Status: <b>FREI</b><br>Leistung: 22 kW')"></div>
            </div>
        </div>

        <h3>💻 Live-Server-Konsole</h3>
        <div class="console-box" id="debugConsole">
            [v7.1.0 Firewall-Schutz-System aktiv]<br>
        </div>
    </div>

    <!-- Vollkommen autarkes Skript: Keine externen Skript-Abhängigkeiten mehr -->
    <script>
        function printLog(text, farbe = "#00ff00") {
            const konsole = document.getElementById("debugConsole");
            if (konsole) {
                const zeit = new Date().toLocaleTimeString();
                konsole.innerHTML += `<span style="color: ${farbe}">[${zeit}] ${text}</span><br>`;
                konsole.scrollTop = konsole.scrollHeight;
            }
        }

        // Steuert das Öffnen der Infoboxen beim Klick auf die Marker
        function zeigeDetails(titel, text) {
            const popup = document.getElementById("popupBox");
            document.getElementById("popupTitle").innerHTML = titel;
            document.getElementById("popupText").innerHTML = text;
            popup.style.display = "block";
            printLog(`Sensor '${titel}' abgefragt ✔`, "#3498db");
        }

        function initialisiereSystem() {
            printLog("Externe Skriptblockade erfolgreich umgangen! ✔", "#2ecc71");
            printLog("Isoliertes CSS/SVG-Kartenraster Dortmund erfolgreich gerendert ✔");
            printLog("Sicherheits-Puffer-Daten erfolgreich geladen ✔");
            printLog("Dashboard voll funktionsfähig online! ✔", "#2ecc71");
        }

        // Sofort ausführen
        window.onload = initialisiereSystem;
    </script>
</body>
</html>
