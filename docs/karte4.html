<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund (Vanilla JS)</title>
    <!-- Wir binden Leaflet über verlässliche CDNs ein, die auch von GitHub akzeptiert werden -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        /* Absolut nativer Karten-Div ohne Shadow-DOM-Verschachtelung */
        #map {
            height: 480px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1; /* Wichtig für Leaflet-Ebenen */
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund (Natives Leaflet)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Initialisiere... ⏳</div>
        </header>

        <div class="card">
            <!-- Das native Standard-Karten-Element -->
            <div id="map"></div>
        </div>
    </div>

    <!-- Laden des Leaflet-Skripts über das hochverfügbare cdnjs -->
    <script src="https://cloudflare.com"></script>
    <script>
        // Dunkelmodus-Erkennung für das Dashboard
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        document.addEventListener("DOMContentLoaded", function() {
            try {
                // 1. Karte initialisieren und auf Dortmund zentrieren (Breitengrad, Längengrad, Zoomstufe)
                const map = L.map('map').setView([51.514, 7.464], 14);

                // 2. OpenStreetMap-Kacheln hinzufügen
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>-Mitwirkende'
                }).addTo(map);

                // 3. IoT-Marker direkt mit GPS-Koordinaten auf die Karte setzen
                const marker1 = L.marker([51.5146, 7.4675]).addTo(map);
                marker1.bindPopup("<h3>🌱 Umweltstation Innenstadt</h3>Typ: senseBox Climate<br>Status: <b>AKTIV</b>");

                const marker2 = L.marker([51.5176, 7.4590]).addTo(map);
                marker2.bindPopup("<h3>🚗 Parkplatz Hauptbahnhof</h3>Typ: LoRaWAN Park-Sensor<br>Status: <b style='color:#e74c3c'>BELEGT</b>");

                const marker3 = L.marker([51.5133, 7.4612]).addTo(map);
                marker3.bindPopup("<h3>🔋 E-Ladesäule Stadtgarten</h3>Typ: IoT-Wallbox<br>Status: <b>FREI</b>");

                // Status-Update bei Erfolg
                document.getElementById("mapStatus").innerHTML = "Status: Live-Karte geladen ✔";
                document.getElementById("mapStatus").style.color = "#27ae60";

            } catch (error) {
                // Falls GitHub oder der Browser dennoch blockiert, fangen wir den Fehler ab
                console.error("Leaflet-Ladefehler:", error);
                document.getElementById("mapStatus").innerHTML = "Status: Durch Browser/GitHub blockiert ❌";
                document.getElementById("mapStatus").style.color = "#e74c3c";
            }
        });
    </script>
</body>
</html>
