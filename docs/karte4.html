<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund (Hybrid-Sicher)</title>
    
    <!-- LOKALES CSS: Lädt absolut unblockbar aus deinem eigenen Verzeichnis -->
    <link rel="stylesheet" href="leaflet.css" onerror="this.removeAttribute('href'); console.log('CSS-Fallback aktiv.');" />
    
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        #map {
            height: 480px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            background-color: #e5e3df;
        }

        .fallback-active {
            background-image: url('dortmund-map.png') !important;
            background-size: cover !important;
            background-position: center !important;
        }

        .map-popup {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            font-size: 0.85rem;
            z-index: 100;
            max-width: 260px;
            border: 1px solid #ccc;
            display: none;
        }
        [data-theme="dark"] .map-popup {
            background: rgba(30, 30, 30, 0.95);
            color: #e0e0e0;
            border-color: #444;
        }

        .iot-marker {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 6px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 90;
            display: none;
        }
        .sensor-1 { top: 38%; left: 80%; background-color: #2ecc71; }
        .sensor-2 { top: 12%; left: 37%; background-color: #e74c3c; }
        .sensor-3 { top: 39%; left: 64%; background-color: #2ecc71; }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund (Hybrid-Sicher)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #d35400; font-size: 0.9rem;">Prüfe System-Sicherheit... ⏳</div>
        </header>

        <div class="card">
            <div id="map">
                <div class="map-popup" id="popupBox">
                    <b id="popupTitle">Sensor-Details</b><br>
                    <span id="popupText">Klicken Sie auf einen Pin für Live-Daten.</span>
                </div>
                <div id="pin1" class="iot-marker sensor-1" onclick="zeigeDetails('🌱 Umweltstation Innenstadt', 'Typ: senseBox Climate<br>Status: <b>AKTIV</b>')"></div>
                <div id="pin2" class="iot-marker sensor-2" onclick="zeigeDetails('🚗 Parkplatz Hauptbahnhof', 'Typ: LoRaWAN Park-Sensor<br>Status: <b style=\'color:#e74c3c\'>BELEGT</b>')"></div>
                <div id="pin3" class="iot-marker sensor-3" onclick="zeigeDetails('🔋 E-Ladesäule Stadtgarten', 'Typ: IoT-Wallbox<br>Status: <b>FREI</b>')"></div>
            </div>
        </div>
    </div>

    <!-- LOKALES JS: Lädt absolut unblockbar aus deinem eigenen Verzeichnis -->
    <script src="leaflet.js" crossorigin="anonymous"></script>
    
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        function zeigeDetails(titel, text) {
            const popup = document.getElementById("popupBox");
            document.getElementById("popupTitle").innerHTML = titel;
            document.getElementById("popupText").innerHTML = text;
            popup.style.display = "block";
        }

        window.onload = function() {
            const mapElement = document.getElementById('map');
            
            if (typeof L !== 'undefined') {
                try {
                    const map = L.map('map').setView([51.514, 7.464], 14);
                    const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap'
                    }).addTo(map);

                    L.marker([51.5146, 7.4675]).addTo(map).bindPopup("<h3>🌱 Umweltstation Innenstadt</h3>Typ: senseBox Climate");
                    L.marker([51.5176, 7.4590]).addTo(map).bindPopup("<h3>🚗 Parkplatz Hauptbahnhof</h3>Typ: LoRaWAN Park-Sensor");
                    L.marker([51.5133, 7.4612]).addTo(map).bindPopup("<h3>🔋 E-Ladesäule Stadtgarten</h3>Typ: IoT-Wallbox");

                    document.getElementById("mapStatus").innerHTML = "Status: Interaktive Live-Karte aktiv ✔";
                    document.getElementById("mapStatus").style.color = "#27ae60";

                } catch (e) {
                    aktiviereLokalesFallback("Kachel-Ladefehler (Netzwerk-Sperre)");
                }
            } else {
                aktiviereLokalesFallback("Leaflet-Skript blockiert (CSP-Richtlinie)");
            }

            function aktiviereLokalesFallback(grund) {
                console.warn("Fallback aktiviert wegen: " + grund);
                mapElement.classList.add('fallback-active');
                document.getElementById('pin1').style.display = 'block';
                document.getElementById('pin2').style.display = 'block';
                document.getElementById('pin3').style.display = 'block';

                document.getElementById("mapStatus").innerHTML = `Status: Lokales Repository-Bild aktiv ✔ (${grund})`;
                document.getElementById("mapStatus").style.color = "#2980b9";
            }
        };
    </script>
</body>
</html>
