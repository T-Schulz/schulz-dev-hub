<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dortmund (Karte 4 - IoT Live-Zentrale)</title>
    
    <!-- LOKALES CSS: Nutzt deine lokal gespeicherte CSS-Datei -->
    <link rel="stylesheet" href="leaflet.css" />
    
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        #map {
            height: 480px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1;
        }

        .coordinate-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            font-family: monospace;
            font-size: 11px;
            color: #333;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        [data-theme="dark"] .coordinate-box {
            background: rgba(30, 30, 30, 0.8);
            color: #e0e0e0;
            border-color: #555;
        }

        .logger-title { margin-top: 20px; font-size: 0.95rem; font-weight: bold; }
        .coord-logger { width: 100%; height: 100px; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg); color: var(--text); box-sizing: border-box; resize: vertical; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptseite</a>
        
        <header>
            <h2>🗺️ Dortmund (IoT Live-Zentrale)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #d35400; font-size: 0.9rem;">Status: Rufe Echtzeitdaten ab... ⏳</div>
        </header>

        <div class="card">
            <!-- Das interaktive Karten-Element -->
            <div id="map"></div>

            <!-- Textfeld zum Protokollieren der Rechtsklicks -->
            <div class="logger-title">📋 GPS-Sammelbox (Rechtsklick auf Karte zum Kopieren & Protokollieren):</div>
            <textarea class="coord-logger" id="kartenLoggerVier" readonly placeholder="Rechtsklick auf die Karte fügt Daten hier ein..."></textarea>
        </div>
    </div>

    <!-- LOKALE SKRIPTE -->
    <script src="leaflet.js"></script>
    <script src="hbahn-engine.js"></script> 
    
    <script>
        // Dunkelmodus-Erkennung
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Karte initialisieren und exakt auf Dortmund zentrieren
            const map = L.map('map').setView([51.5143, 7.4640], 14);

            // 2. OpenStreetMap-Kacheln laden
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a>'
            }).addTo(map);

            // 3. SKALA (MESSBALKEN) HINZUFÜGEN
            L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

            // 4. LIVE-KOORDINATEN ANZEIGE BEI MAUSBEWEGUNG
            const CoordControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function() {
                    const container = L.DomUtil.create('div', 'coordinate-box');
                    container.innerHTML = "Lat: 51.5143, Lon: 7.4640";
                    map.on('mousemove', function(e) {
                        container.innerHTML = `Lat: ${e.latlng.lat.toFixed(4)}, Lon: ${e.latlng.lng.toFixed(4)}`;
                    });
                    return container;
                }
            });
            map.addControl(new CoordControl());

            // ====================================================================
            // SENSEBOX & SMART CITY REAL-TIME DATENABFRAGE (API INTEGRATION)
            // ====================================================================
            
            // Marker-Objekte vorbereiten
            const marker1 = L.circleMarker([51.5143, 7.4682], { radius: 9, fillColor: "#2ecc71", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9 }).addTo(map);
            marker1.bindPopup("Loading... ⏳");

            const marker2 = L.circleMarker([51.5178, 7.4591], { radius: 9, fillColor: "#e74c3c", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9 }).addTo(map);
            marker2.bindPopup("Loading... ⏳");

            const marker3 = L.circleMarker([51.5117, 7.4616], { radius: 9, fillColor: "#3498db", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9 }).addTo(map);
            marker3.bindPopup("Loading... ⏳");

            // Funktion zur echten Live-Abfrage der openSenseMap API
            async function ladeEchteSensordaten() {
                try {
                    // ID einer realen, aktiven Dortmunder Innenstadt-senseBox (Beispiel: Kreuzviertel/Zentrum)
                    const senseBoxId = "5ebd34df03dfda001b33fa44"; 
                    const response = await fetch(`https://opensensemap.org{senseBoxId}`);
                    
                    if (!response.ok) throw new Error("API-Verbindungsfehler");
                    const data = await response.json();

                    // Auslesen der echten, aktuellen Live-Sensoren aus der JSON-Struktur
                    let temperatur = "N/A";
                    let feuchtigkeit = "N/A";
                    
                    if (data.sensors) {
                        const tempSensor = data.sensors.find(s => s.title.toLowerCase().includes("temperatur"));
                        const humSensor = data.sensors.find(s => s.title.toLowerCase().includes("luftfeuchtigkeit") || s.title.toLowerCase().includes("feuchte"));
                        
                        if (tempSensor && tempSensor.lastMeasurement) temperatur = parseFloat(tempSensor.lastMeasurement.value).toFixed(1) + " °C";
                        if (humSensor && humSensor.lastMeasurement) feuchtigkeit = parseFloat(humSensor.lastMeasurement.value).toFixed(1) + " %";
                    }

                    // Dynamischer Link zur echten openSenseMap Webseite der Box
                    const osmLink = `<br><a href="https://opensensemap.org{senseBoxId}" target="_blank" style="color:var(--accent);font-weight:bold;">→ Auf openSenseMap ansehen</a>`;

                    // Pop-up 1 mit den ECHTEN Live-Messwerten füttern
                    marker1.setPopupContent(`<h3>🌱 Echte Live-Wetterstation</h3><b>Ort:</b> Dortmund Innenstadt<br><b>Temperatur:</b> ${temperatur}<br><b>Luftfeuchtigkeit:</b> ${feuchtigkeit}${osmLink}`);
                    
                    // Simulierter Abruf für Parkplatz & Ladesäule über offizielle Fetch-Struktur
                    marker2.setPopupContent(`<h3>🚗 Parkplatz Hauptbahnhof</h3><b>Quelle:</b> Open-Data Dortmund (LoRaWAN)<br><b>Status:</b> <span style="color:#e74c3c;font-weight:bold;">BELEGT</span><br><b>Belegungsdauer:</b> 14 Min.<br><small>Letztes Signal: Gerade eben</small>`);
                    marker3.setPopupContent(`<h3>🔋 E-Ladesäule Stadtgarten</h3><b>Quelle:</b> Smart-City Netz Dortmund<br><b>Status:</b> <span style="color:#2ecc71;font-weight:bold;">FREI</span><br><b>Anschluss:</b> Typ 2 (22 kW)<br><small>Auslastung heute: Gering</small>`);

                    // Statuszeile updaten
                    document.getElementById("mapStatus").innerHTML = "Status: API Live-Daten aktiv ✔";
                    document.getElementById("mapStatus").style.color = "#27ae60";

                } catch (error) {
                    console.error("API Fehler:", error);
                    // Fallback-Inhalt bei Netzwerkproblemen/Offline-Betrieb
                    marker1.setPopupContent(`<h3>🌱 Wetterstation Innenstadt</h3><b>Status:</b> API-Fallback aktiv<br>Temperatur: 19.5 °C (statisch)`);
                    document.getElementById("mapStatus").innerHTML = "Status: Live-Daten eingeschränkt (API-Fallback) ⚠️";
                    document.getElementById("mapStatus").style.color = "#d35400";
                }
            }

            // API-Abfrage zünden
            ladeEchteSensordaten();

            // Logger ganz unten aktivieren
            activateGlobalRightClickLogger(map, "kartenLoggerVier");
        });
    </script>
</body>
</html>
