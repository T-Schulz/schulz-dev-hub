<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dortmund (Karte 4 - IoT Live-Zentrale)</title>
    
    <!-- LOKALES CSS -->
    <link rel="stylesheet" href="leaflet.css" />
    
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        #map {
            height: 480px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1;
        }

        .coordinate-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            font-family: monospace;
            font-size: 11px;
            color: #333;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        [data-theme="dark"] .coordinate-box {
            background: rgba(30, 30, 30, 0.8);
            color: #e0e0e0;
            border-color: #555;
        }

        .logger-title { margin-top: 20px; font-size: 0.95rem; font-weight: bold; }
        .coord-logger { width: 100%; height: 100px; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg); color: var(--text); box-sizing: border-box; resize: vertical; margin-top: 5px; }
        
        /* Styling für die Live-Wetter-Grafik im Pop-up */
        .weather-banner {
            width: 100%;
            height: auto;
            margin-top: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptseite</a>
        
        <header>
            <h2>🗺️ Dortmund (IoT Live-Zentrale)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Live-Karte aktiv ✔</div>
        </header>

        <div class="card">
            <div id="map"></div>
            <div class="logger-title">📋 GPS-Sammelbox (Rechtsklick auf Karte zum Kopieren & Protokollieren):</div>
            <textarea class="coord-logger" id="kartenLoggerVier" readonly placeholder="Rechtsklick auf die Karte fügt Daten ein..."></textarea>
        </div>
    </div>

    <!-- LOKALE SKRIPTE -->
    <script src="leaflet.js"></script>
    <script src="hbahn-engine.js"></script> 
    
    <script>
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        document.addEventListener("DOMContentLoaded", function() {
            const map = L.map('map').setView([51.5143, 7.4640], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

            // Koordinatenanzeige unten rechts
            const CoordControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function() {
                    const container = L.DomUtil.create('div', 'coordinate-box');
                    container.innerHTML = "Lat: 51.5143, Lon: 7.4640";
                    map.on('mousemove', function(e) {
                        container.innerHTML = `Lat: ${e.latlng.lat.toFixed(4)}, Lon: ${e.latlng.lng.toFixed(4)}`;
                    });
                    return container;
                }
            });
            map.addControl(new CoordControl());

            // 1. Umwelt-Marker (Grün) mit unblockbarem Vektor-Wetter-Widget
            const marker1 = L.circleMarker([51.5143, 7.4682], {
                radius: 8, fillColor: "#2ecc71", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9
            }).addTo(map);
            
            // Dieses Bild zieht Echtzeitdaten für Dortmund rein über ein unblockbares Grafik-Element (img)
            const wetterPopupHtml = `
                <h3>🌱 Umweltstation Reinoldikirche</h3>
                <b>Typ:</b> IoT Wetter-Zentralstation<br>
                <b>Aktuelles Dortmund-Wetter (Live):</b><br>
                <img class="weather-banner" src="https://wttr.in" alt="Wetter Dortmund">
            `;
            marker1.bindPopup(wetterPopupHtml, { maxWidth: 300 });

            // 2. Parkplatz-Marker
            const marker2 = L.circleMarker([51.5178, 7.4591], {
                radius: 8, fillColor: "#e74c3c", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9
            }).addTo(map);
            marker2.bindPopup("<h3>🚗 Parkplatz Hauptbahnhof</h3>Typ: LoRaWAN Park-Sensor<br>Status: <b style='color:#e74c3c'>BELEGT</b><br>Dauer: 42 Min.");

            // 3. E-Ladesäulen-Marker
            const marker3 = L.circleMarker([51.5117, 7.4616], {
                radius: 8, fillColor: "#3498db", color: "#ffffff", weight: 2, opacity: 1, fillOpacity: 0.9
            }).addTo(map);
            marker3.bindPopup("<h3>🔋 E-Ladesäule Stadtgarten</h3>Typ: IoT-Wallbox<br>Status: <b>FREI</b><br>Leistung: 22 kW");

            // Logger aktivieren
            activateGlobalRightClickLogger(map, "kartenLoggerVier");
        });
    </script>
</body>
</html>
