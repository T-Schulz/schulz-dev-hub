<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund (Test Animation)</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        /* Das statische Hintergrundbild aus Karte 1 */
        #map-container {
            height: 480px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            background-image: url('dortmund-map.png');
            background-size: cover;
            background-position: center;
            background-color: #e5e3df;
        }

        /* Das Test-Symbol: Ein rotes Quadrat, das wir per Code verschieben */
        #test-waggon {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #e74c3c;
            border: 2px solid white;
            border-radius: 4px;
            box-shadow: 0 0 6px rgba(0,0,0,0.4);
            top: 40%;    /* Feste vertikale Position */
            left: 10%;   /* Startposition links */
            z-index: 50;
            transition: left 0.1s linear; /* Sorgt für flüssiges Gleiten */
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <div class="card">
            <h2>🗺️ Geo-Leitstelle Dortmund (Animations-Testlauf)</h2>
            <p id="animStatus" style="font-weight: bold; color: #007bff;">Status: Bereite Triebwagen vor... ⏳</p>
            
            <div id="map-container">
                <!-- Das animierte Element -->
                <div id="test-waggon"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const waggon = document.getElementById("test-waggon");
            const statusText = document.getElementById("animStatus");
            
            let positionX = 10; // Start bei 10% von links
            let richtungVorwaerts = true;

            statusText.innerHTML = "Status: Animation läuft aktiv! 🟢";
            statusText.style.color = "#27ae60";

            // Intervall startet: Alle 50 Millisekunden wird die Position aktualisiert
            setInterval(function() {
                if (richtungVorwaerts) {
                    positionX += 0.5; // Bewege nach rechts
                    if (positionX >= 85) {
                        richtungVorwaerts = false; // Am rechten Rand umkehren
                    }
                } else {
                    positionX -= 0.5; // Bewege nach links
                    if (positionX <= 10) {
                        richtungVorwaerts = true; // Am linken Rand umkehren
                    }
                }

                // Die neue Prozent-Position direkt an das CSS-Element übergeben
                waggon.style.left = positionX + "%";
            }, 50);
        });
    </script>
</body>
</html>
