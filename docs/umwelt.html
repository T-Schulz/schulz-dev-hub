
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umwelt & Wetter - Dev-Hub</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #27ae60;
            --border: #e0e0e0;
            --temp-accent: #e67e22;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #2ecc71;
            --border: #333333;
            --temp-accent: #f39c12;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-link { display: inline-block; background-color: #333; color: white !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        
        /* Unblockbares CSS-Diagramm */
        .chart-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .bar-group { display: flex; flex-direction: column; gap: 5px; }
        .bar-label { font-size: 0.9rem; font-weight: bold; }
        .bar-wrapper { width: 100%; background: #eee; border-radius: 4px; height: 24px; overflow: hidden; position: relative; }
        [data-theme="dark"] .bar-wrapper { background: #333; }
        .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 1s ease-in-out; }
        .bar-fill.temp { background: var(--temp-accent); }
        .bar-value { position: absolute; right: 10px; top: 2px; font-size: 0.85rem; font-weight: bold; color: #333; }
        [data-theme="dark"] .bar-value { color: #fff; }
        .timestamp { font-size: 0.8rem; color: #777; margin-top: 15px; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        <header>
            <h1>🌱 Umwelt & Wetter</h1>
        </header>

        <!-- Reaktiviert: Live IoT-Temperatursensoren (Dortmund) -->
        <div class="card">
            <h2>🌡️ Live-Temperatur (Klimamessnetz)</h2>
            <p>Echtzeit-Messwerte städtischer IoT-Sensoren, überbrückt via CORS-Proxy.</p>
            
            <div class="chart-container">
                <div class="bar-group">
                    <div class="bar-label" id="station1-label">📍 Dortmund Friedensplatz</div>
                    <div class="bar-wrapper">
                        <div class="bar-fill temp" id="station1-bar" style="width: 0%;"></div>
                        <div class="bar-value" id="station1-val">Lädt...</div>
                    </div>
                </div>
                <div class="bar-group">
                    <div class="bar-label" id="station2-label">📍 Dortmund (Vergleichsstation)</div>
                    <div class="bar-wrapper">
                        <div class="bar-fill temp" id="station2-bar" style="width: 0%;"></div>
                        <div class="bar-value" id="station2-val">Lädt...</div>
                    </div>
                </div>
            </div>
            <div class="timestamp" id="iot-timestamp">Stand: --:--:--</div>
        </div>
    </div>

    <!-- API-Integration mit CORS Bypass -->
    <script>
        async function fetchTemperatureData() {
            const targetUrl = 'https://dortmund.de';
            // Nutzung eines öffentlichen, anmeldefreien CORS-Proxys
            const proxyUrl = 'https://allorigins.win' + encodeURIComponent(targetUrl);
            
            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error('Proxy-Fehler beim API-Aufruf');
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    
                    // Suchen der passenden Stationen im JSON-Objekt
                    const friedensplatz = data.results.find(r => r.fields && r.fields.de_bezeichnung === "Friedensplatz") || data.results[0];
                    const vergleichsStation = data.results.find(r => r.fields && r.fields.de_bezeichnung !== friedensplatz.fields.de_bezeichnung) || data.results[1];

                    // Dynamische Balkenbreite (-10°C bis 40°C)
                    const calcWidth = (temp) => {
                        const min = -10, max = 40;
                        const percentage = ((temp - min) / (max - min)) * 100;
                        return Math.min(Math.max(percentage, 0), 100); 
                    };

                    // Station 1 befüllen
                    if (friedensplatz && friedensplatz.fields) {
                        const f = friedensplatz.fields;
                        const temp1 = parseFloat(f.lufttemperatur);
                        if (!isNaN(temp1)) {
                            document.getElementById('station1-label').innerText = `📍 ${f.de_bezeichnung}`;
                            document.getElementById('station1-bar').style.width = `${calcWidth(temp1)}%`;
                            document.getElementById('station1-val').innerText = `${temp1.toFixed(1)} °C`;
                        }
                    }

                    // Station 2 befüllen
                    if (vergleichsStation && vergleichsStation.fields) {
                        const v = vergleichsStation.fields;
                        const temp2 = parseFloat(v.lufttemperatur);
                        if (!isNaN(temp2)) {
                            document.getElementById('station2-label').innerText = `📍 ${v.de_bezeichnung}`;
                            document.getElementById('station2-bar').style.width = `${calcWidth(temp2)}%`;
                            document.getElementById('station2-val').innerText = `${temp2.toFixed(1)} °C`;
                        }
                    }

                    // Zeitstempel der Messung ausgeben
                    const updateTime = friedensplatz.fields.timestamp || new Date().toISOString();
                    document.getElementById('iot-timestamp').innerText = `Messung vom: ${new Date(updateTime).toLocaleString('de-DE')}`;
                }
            } catch (error) {
                console.error('CORS-Proxy Fehler:', error);
                document.getElementById('station1-val').innerText = 'API gesperrt (CORS)';
                document.getElementById('station2-val').innerText = 'API gesperrt (CORS)';
            }
        }

        // Ausführen beim Seitenstart und alle 5 Minuten aktualisieren
        fetchTemperatureData();
        setInterval(fetchTemperatureData, 300000);
    </script>
</body>
</html>
