
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umwelt - Dev-Hub</title>
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card-bg: #ffffff; --accent: #27ae60; --border: #e0e0e0; }
        [data-theme="dark"] { --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --accent: #2ecc71; --border: #333333; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 20px; margin-bottom: 30px; }
        .btn-toggle { background-color: transparent; color: var(--text); border: 2px solid var(--border); padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        .btn-link { display: inline-block; background-color: #333; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; }
        .data-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück</a>
        <header>
            <h1>🌱 Umwelt & Wetter</h1>
            <button class="btn-toggle" id="themeToggle">🌓 Modus wechseln</button>
        </header>

        <div class="card">
            <h3 id="klimaStatus">📈 Aktuelle städtische Klimasensoren (Dortmund)</h3>
            <div id="klimaDatenContainer"></div>
        </div>
    </div>

    <script>
        const pufferKlima = [
            { station: "Dortmund-Mitte (Puffer)", temp: 18.5, hum: 62 },
            { station: "Dortmund-Hörde (Puffer)", temp: 17.9, hum: 65 }
        ];

        function renderRows(daten) {
            const container = document.getElementById("klimaDatenContainer");
            container.innerHTML = "";
            daten.forEach(d => {
                const row = document.createElement("div");
                row.className = "data-row";
                row.innerHTML = `<span>📍 ${d.station}</span> <strong>${d.temp}°C / ${d.hum}% rF</strong>`;
                container.appendChild(row);
            });
        }

        async function ladeKlimaDaten() {
            try {
                const response = await fetch("https://opendatasoft.com");
                if(!response.ok) throw new Error();
                const data = await response.json();

                if(data.results && data.results.length > 0) {
                    const formatierteDaten = data.results.map(r => ({
                        station: r.station_name || "Klimastation",
                        temp: r.air_temperature ?? "--",
                        hum: r.relative_humidity ?? "--"
                    }));
                    renderRows(formatierteDaten);
                } else { throw new Error(); }
            } catch(e) {
                renderRows(pufferKlima);
                document.getElementById("klimaStatus").innerText += " [Puffer-Modus]";
            }
        }
        ladeKlimaDaten();

        document.getElementById("themeToggle").addEventListener("click", () => {
            const currentTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", currentTheme);
        });
    </script>
</body>
</html>
