
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umwelt & Wetter - Dev-Hub</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #27ae60;
            --border: #e0e0e0;
            --debug-bg: #2d3748;
            --debug-text: #edf2f7;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #2ecc71;
            --border: #333333;
            --debug-bg: #1a202c;
            --debug-text: #a0aec0;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-link { display: inline-block; background-color: #333; color: white !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        
        /* Debug-Konsolen-Design */
        .debug-console {
            background-color: var(--debug-bg);
            color: var(--debug-text);
            font-family: "Courier New", Courier, monospace;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
            max-height: 400px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }
        .status-loading { background: #d69e2e; color: #fff; }
        .status-success { background: #38a169; color: #fff; }
        .status-error { background: #e53e3e; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        <header>
            <h1>🌱 Umwelt & Wetter</h1>
        </header>

        <!-- Debugging-Zentrale -->
        <div class="card">
            <h2>🛠️ Live-API Debugger</h2>
            <p>Überprüft den aktuellen Zustand der Verbindung zum Klimamessnetz Dortmund.</p>
            
            <div id="status-badge" class="status-badge status-loading">Initialisiere...</div>
            <div id="debug-log" class="debug-console">Starte Debug-Prozess...</div>
        </div>
    </div>

    <script>
        const logContainer = document.getElementById('debug-log');
        const badge = document.getElementById('status-badge');

        function log(message, type = 'info') {
            const prefix = type === 'error' ? '❌ ' : type === 'success' ? '✅ ' : 'ℹ️ ';
            logContainer.textContent += `\n[${new Date().toLocaleTimeString()}] ${prefix}${message}`;
            logContainer.scrollTop = logContainer.scrollHeight; 
        }

        function setStatus(text, className) {
            badge.innerText = text;
            badge.className = `status-badge ${className}`;
        }

        async function debugAPI() {
            // URL der v2.1 Explore API
            const apiUrl = 'https://dortmund.de';
            
            log(`Verbindungsaufbau zu: ${apiUrl}`);
            
            try {
                const response = await fetch(apiUrl);
                log(`HTTP-Status erhalten: ${response.status} (${response.statusText})`);
                
                if (!response.ok) {
                    throw new Error(`Server antwortete mit Status ${response.status}`);
                }
                
                log("HTTP-Verbindung erfolgreich. Versuche JSON zu parsen...");
                const data = await response.json();
                log("JSON erfolgreich dekodiert.");

                // Untersuche Struktur
                log(`Anzahl gefundener Ergebnisse (results): ${data.results ? data.results.length : 0}`);
                
                if (data.results && data.results.length > 0) {
                    setStatus("Verbindung Aktiv", "status-success");
                    log("Struktur der ersten 3 Datensätze wird analysiert:");
                    
                    data.results.slice(0, 3).forEach((item, index) => {
                        log(`\n--- Sensor Index [${index}] ---`);
                        // Prüfen ob Daten flach oder geschachtelt vorliegen
                        if (item.fields) {
                            log(`Typ: Geschachtelt (.fields vorhanden)`);
                            log(`Name: ${item.fields.de_bezeichnung || 'Nicht definiert'}`);
                            log(`Temperatur-Wert: ${item.fields.lufttemperatur !== undefined ? item.fields.lufttemperatur : 'Fehlt'}`);
                        } else {
                            log(`Typ: Flach (Kein .fields-Unterobjekt)`);
                            log(`Name: ${item.de_bezeichnung || 'Nicht definiert'}`);
                            log(`Temperatur-Wert: ${item.lufttemperatur !== undefined ? item.lufttemperatur : 'Fehlt'}`);
                        }
                    });

                    log(`\nKomplettes rohes JSON-Beispiel (erster Eintrag):\n${JSON.stringify(data.results[0], null, 2)}`);
                } else {
                    throw new Error("Das 'results'-Array der API ist leer.");
                }

            } catch (error) {
                setStatus("Fehler aufgetreten", "status-error");
                log(`Fehler-Details: ${error.message}`, 'error');
                log("Mögliche Ursache: Lokale Netzwerkblockade, CORS-Richtlinien-Konflikt oder temporärer API-Ausfall.", 'error');
            }
        }

        // Starte Debugging sofort
        debugAPI();
    </script>
</body>
</html>
