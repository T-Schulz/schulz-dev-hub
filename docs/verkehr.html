<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verkehr - Dev-Hub</title>
    <style>
        :root { --bg: #f4f4f9; --text: #333; --card-bg: #ffffff; --accent: #2980b9; --border: #e0e0e0; }
        [data-theme="dark"] { --bg: #121212; --text: #e0e0e0; --card-bg: #1e1e1e; --accent: #3498db; --border: #333333; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 20px; margin-bottom: 30px; }
        .btn-toggle { background-color: transparent; color: var(--text); border: 2px solid var(--border); padding: 8px 15px; border-radius: 20px; cursor: pointer; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        .btn-link { display: inline-block; background-color: #333; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; }
        .data-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück</a>
        <header>
            <h1>🚗 Parken & Verkehr</h1>
            <button class="btn-toggle" id="themeToggle">🌓 Modus wechseln</button>
        </header>

        <div class="card">
            <h3>📍 Live IoT Park-Sensoren (Dortmund)</h3>
            <div id="sensorListContainer">
                <div class="data-row"><span>Verbindung zum städtischen Daten-Hub wird aufgebaut...</span></div>
            </div>
        </div>
    </div>

    <script>
        async function ladeVerkehrsSensoren() {
            try {
                const response = await fetch("https://opendatasoft.com");
                const data = await response.json();
                const container = document.getElementById("sensorListContainer");
                container.innerHTML = "";

                if(data.results && data.results.length > 0) {
                    data.results.forEach(rec => {
                        const name = rec.parking_space_name || "IoT Stellplatz";
                        const statusText = (rec.status === "occupied" || rec.status === "belegt") ? "Belegt" : "Frei";
                        const farbe = statusText === "Belegt" ? "#e74c3c" : "#2ecc71";

                        const row = document.createElement("div");
                        row.className = "data-row";
                        row.innerHTML = `<span>🚗 ${name}</span> <strong style="color: ${farbe}">${statusText}</strong>`;
                        container.appendChild(row);
                    });
                } else {
                    container.innerHTML = "<div class='data-row'>Keine Daten empfangen.</div>";
                }
            } catch(e) {
                document.getElementById("sensorListContainer").innerHTML = "<div class='data-row'>API-Fehler beim Datenabruf.</div>";
            }
        }
        ladeVerkehrsSensoren();

        document.getElementById("themeToggle").addEventListener("click", () => {
            const currentTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", currentTheme);
        });
    </script>
</body>
</html>
