<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev-Hub Dashboard</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        a { color: var(--accent); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 Mein Dev-Hub</h1>
            <button id="themeToggle">🌓 Modus wechseln</button>
        </header>

        <div class="card">
            <h2>Willkommen auf meinem zentralen Dashboard</h2>
            <p>Hier koordiniere ich meine Projekte und Experimente.</p>
        </div>

        <div class="grid">
            <div class="card">
                <h3>📁 Skripte</h3>
                <p>Nützliche Helfer zur Systemüberwachung.</p>
                <a href="https://github.com">Zum Ordner →</a>
            </div>
            <div class="card">
                <h3>🧪 Sandbox</h3>
                <p>Hier teste ich neue Web-Technologien.</p>
                <a href="#">Projekte ansehen →</a>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById("themeToggle");
        btn.addEventListener("click", () => {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", newTheme);
        });
    </script>
</body>
</html>
