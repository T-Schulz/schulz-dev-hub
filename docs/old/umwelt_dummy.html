
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umwelt & Wetter - Dev-Hub</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #27ae60;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #2ecc71;
            --border: #333333;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 20px; }
        .btn-link { display: inline-block; background-color: #333; color: white !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-bottom: 15px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        
        /* Unblockbares CSS-Diagramm */
        .chart-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .bar-group { display: flex; flex-direction: column; gap: 5px; }
        .bar-label { font-size: 0.9rem; font-weight: bold; }
        .bar-wrapper { width: 100%; background: #eee; border-radius: 4px; height: 24px; overflow: hidden; position: relative; }
        [data-theme="dark"] .bar-wrapper { background: #333; }
        .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 1s ease-in-out; }
        .bar-value { position: absolute; right: 10px; top: 2px; font-size: 0.85rem; font-weight: bold; color: #333; }
        [data-theme="dark"] .bar-value { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        <header>
            <h1>🌱 Umwelt & Wetter</h1>
        </header>

        <div class="card">
            <h2>Luftqualität & Klimasensoren (Dortmund)</h2>
            <p>Aktuelle Feinstaub-Belastung (PM10) im Stadtgebiet. Werte unter 50 µg/m³ gelten als unbedenklich.</p>
            
            <div class="chart-container">
                <div class="bar-group">
                    <div class="bar-label">📍 Dortmund-Mitte (Klimastation)</div>
                    <div class="bar-wrapper">
                        <div class="bar-fill" style="width: 36%;"></div>
                        <div class="bar-value">18 µg/m³ (Gut)</div>
                    </div>
                </div>
                <div class="bar-group">
                    <div class="bar-label">📍 Dortmund-Hörde</div>
                    <div class="bar-wrapper">
                        <div class="bar-fill" style="width: 48%; background: #f39c12;"></div>
                        <div class="bar-value">24 µg/m³ (Akzeptabel)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
