<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Leitstelle - Dortmund (Karte 2 - Reale Daten)</title>
    
    <!-- LOKALES CSS: Nutzt deine lokal gespeicherte CSS-Datei -->
    <link rel="stylesheet" href="leaflet.css" />
    
    <style>
        :root {
            --bg: #f4f4f9;
            --text: #333;
            --card-bg: #ffffff;
            --accent: #007bff;
            --border: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --border: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .btn-link {
            display: inline-block;
            background-color: #333;
            color: white !important;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            border: none;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        #map {
            height: 480px;
            width: 100%;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            z-index: 1;
        }

        /* Styling für die Koordinatenbox unten rechts auf der Karte */
        .coordinate-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            font-family: monospace;
            font-size: 11px;
            color: #333;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        [data-theme="dark"] .coordinate-box {
            background: rgba(30, 30, 30, 0.8);
            color: #e0e0e0;
            border-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn-link" href="index.html">← Zurück zur Hauptzentrale</a>
        
        <header>
            <h2>🗺️ Geo-Leitstelle Dortmund (Reale Sensordaten)</h2>
            <div id="mapStatus" style="font-weight: bold; color: #27ae60; font-size: 0.9rem;">Status: Live-Karte aktiv ✔</div>
        </header>

        <div class="card">
            <!-- Das interaktive Karten-Element -->
            <div id="map"></div>
        </div>
    </div>

    <!-- LOKALES SCRIPT: Nutzt deine lokal gespeicherte JS-Datei -->
    <script src="leaflet.js"></script>
    
    <script>
        // Dunkelmodus-Erkennung
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Karte initialisieren und exakt auf Dortmund zentrieren
            const map = L.map('map').setView([51.5143, 7.4640], 14);

            // 2. OpenStreetMap-Kacheln laden
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a>'
            }).addTo(map);

            // 3. SKALA (MESSBALKEN) HINZUFÜGEN
            L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

            // 4. LIVE-KOORDINATEN ANZEIGE BEI MAUSBEWEGUNG
            const CoordControl = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function() {
                    const container = L.DomUtil.create('div', 'coordinate-box');
                    container.innerHTML = "Lat: 51.5143, Lon: 7.4640";
                    map.on('mousemove', function(e) {
                        container.innerHTML = `Lat: ${e.latlng.lat.toFixed(4)}, Lon: ${e.latlng.lng.toFixed(4)}`;
                    });
                    return container;
                }
            });
            map.addControl(new CoordControl());

            // 5. REALE MARKER ALS SVG-KREISE PLATZIEREN (Behebt den Grafikfehler komplett)
            
            // Sensor 1: Umweltstation (Grün)
            const marker1 = L.circleMarker([51.5143, 7.4682], {
                radius: 8,
                fillColor: "#2ecc71",
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(map);
            marker1.bindPopup("<h3>🌱 Umweltstation Reinoldikirche</h3>Typ: senseBox Climate<br>GPS: 51.5143, 7.4682<br>Status: <b>AKTIV</b>");

            // Sensor 2: Parkplatz (Rot)
            const marker2 = L.circleMarker([51.5178, 7.4591], {
                radius: 8,
                fillColor: "#e74c3c",
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(map);
            marker2.bindPopup("<h3>🚗 Parkplatz Hauptbahnhof</h3>Typ: LoRaWAN Park-Sensor<br>GPS: 51.5178, 7.4591<br>Status: <b style='color:#e74c3c'>BELEGT</b>");

            // Sensor 3: E-Ladesäule (Blau / Grün)
            const marker3 = L.circleMarker([51.5117, 7.4616], {
                radius: 8,
                fillColor: "#3498db",
                color: "#ffffff",
                weight: 2,
                opacity: 1,
                fillOpacity: 0.9
            }).addTo(map);
            marker3.bindPopup("<h3>🔋 E-Ladesäule Stadtgarten</h3>Typ: IoT-Wallbox<br>GPS: 51.5117, 7.4616<br>Status: <b>FREI</b>");
        });
    </script>
</body>
</html>
